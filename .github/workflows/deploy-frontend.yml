name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-frontend.yml"
      - "astro/**"
      - "frontend/**"
      - "netlify.toml"
      - "package.json"
      - "scripts/build_static_site.sh"
      - "vercel.json"
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NETLIFY_SITE_ID: 65af318c-45c6-413e-837b-685a4fc01444
  VERCEL_ORG_ID: team_a3kKe1wDrxqQfuXTUnw4SUxw
  VERCEL_PROJECT_ID: prj_wQljgcHZu1IhJ0CBloPc4yiWJlcb

jobs:
  build-and-deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        id: cache-node
        uses: actions/cache@v4
        with:
          path: astro/node_modules
          key: node-${{ hashFiles('astro/package-lock.json') }}

      - name: Cache Astro build
        uses: actions/cache@v4
        with:
          path: astro/.astro
          key: astro-${{ hashFiles('astro/src/**', 'astro/public/**') }}
          restore-keys: astro-

      - name: Install (cache miss only)
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: cd astro && npm ci

      - name: Build
        run: cd astro && npm run build

      - name: Deploy to Vercel
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ env.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ env.VERCEL_PROJECT_ID }}
        run: |
          [ -z "$VERCEL_TOKEN" ] && echo "::warning::VERCEL_TOKEN not set" && exit 0
          cd astro && npx vercel deploy --prod \
            --token="$VERCEL_TOKEN" \
            --dir=dist \
            --local-config=../../vercel.json

      - name: Deploy to Netlify
        continue-on-error: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          [ -z "$NETLIFY_AUTH_TOKEN" ] && echo "::warning::NETLIFY_AUTH_TOKEN not set" && exit 0
          npx --yes netlify-cli deploy \
            --dir=astro/dist \
            --prod \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN"
