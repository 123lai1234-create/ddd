name: Export Godot Game

on:
  push:
    branches: [main]
    paths:
      - "frontend/games/xian-godot/**"
  workflow_dispatch:

concurrency:
  group: export-godot
  cancel-in-progress: true

permissions:
  contents: read

env:
  GODOT_VERSION: "4.3"
  GODOT_RELEASE: "stable"
  NETLIFY_SITE_ID: 65af318c-45c6-413e-837b-685a4fc01444
  VERCEL_ORG_ID: team_a3kKe1wDrxqQfuXTUnw4SUxw
  VERCEL_PROJECT_ID: prj_wQljgcHZu1IhJ0CBloPc4yiWJlcb

jobs:
  export-and-deploy:
    name: Export Godot → Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # ── Godot install (cached) ───────────────────────────────
      - name: Cache Godot binary + export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            /tmp/godot4
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}

      - name: Install Godot ${{ env.GODOT_VERSION }}
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          VER="${GODOT_VERSION}-${GODOT_RELEASE}"
          wget -q "https://github.com/godotengine/godot/releases/download/${VER}/Godot_v${VER}_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp
          mv "/tmp/Godot_v${VER}_linux.x86_64" /tmp/godot4
          chmod +x /tmp/godot4

      - name: Install Godot export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          VER="${GODOT_VERSION}-${GODOT_RELEASE}"
          TPL_DIR=~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}
          mkdir -p "$TPL_DIR"
          wget -q "https://github.com/godotengine/godot/releases/download/${VER}/Godot_v${VER}_export_templates.tpz" -O /tmp/tpl.tpz
          unzip -q /tmp/tpl.tpz -d /tmp/tpl
          mv /tmp/tpl/templates/* "$TPL_DIR/"

      # ── Export ───────────────────────────────────────────────
      - name: Export Godot game (Web)
        run: |
          mkdir -p astro/public/games/xian-godot
          /tmp/godot4 --headless \
            --path "${{ github.workspace }}/frontend/games/xian-godot" \
            --export-release "Web" \
            "${{ github.workspace }}/astro/public/games/xian-godot/index.html"
          echo "=== Exported files ==="
          ls -lh astro/public/games/xian-godot/

      # ── Build Astro ──────────────────────────────────────────
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache node_modules
        id: cache-node
        uses: actions/cache@v4
        with:
          path: astro/node_modules
          key: node-${{ hashFiles('astro/package-lock.json') }}

      - name: Install (cache miss only)
        if: steps.cache-node.outputs.cache-hit != 'true'
        run: cd astro && npm ci

      - name: Build Astro
        run: cd astro && npm run build

      # ── Deploy ───────────────────────────────────────────────
      - name: Deploy to Vercel (prebuilt)
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          [ -z "$VERCEL_TOKEN" ] && echo "::warning::VERCEL_TOKEN not set" && exit 0
          mkdir -p .vercel/output/static
          cp -r astro/dist/. .vercel/output/static/
          echo '{"version":3}' > .vercel/output/config.json
          npx --yes vercel deploy --prod --prebuilt --token="$VERCEL_TOKEN" 2>&1 | tail -10

      - name: Deploy to Netlify
        continue-on-error: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          [ -z "$NETLIFY_AUTH_TOKEN" ] && echo "::warning::NETLIFY_AUTH_TOKEN not set" && exit 0
          npx --yes netlify-cli deploy \
            --dir=astro/dist --prod \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN"
