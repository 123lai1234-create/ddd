name: Scheduled Data Sync

on:
  schedule:
    - cron: '20 8 * * 1-5'
    - cron: '20 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  RAILWAY_PROJECT_ID: 098c670f-4a87-475e-b934-ca8b7dc74f4e
  RAILWAY_ENVIRONMENT_ID: ea437d7d-5e2d-4a84-92e5-afd344389170
  RAILWAY_SERVICE_ID: 29c6f948-a536-4f11-a317-dad1293a66ac

jobs:
  market-sync:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '20 8 * * 1-5'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve Railway public domain
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          if [ -z "$RAILWAY_API_TOKEN" ]; then
            echo "API_BASE_URL=https://donttalk-api-production.up.railway.app" >> "$GITHUB_ENV"
            exit 0
          fi
          response=$(curl -sS https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"query":"query($projectId:String!,$environmentId:String!,$serviceId:String!){ domains(projectId:$projectId, environmentId:$environmentId, serviceId:$serviceId){ serviceDomains { domain } } }","variables":{"projectId":"'"$RAILWAY_PROJECT_ID"'","environmentId":"'"$RAILWAY_ENVIRONMENT_ID"'","serviceId":"'"$RAILWAY_SERVICE_ID"'"}}')
          railway_domain=$(printf '%s' "$response" | python3 -c "import json, sys; data = json.load(sys.stdin); print(data.get('data', {}).get('domains', {}).get('serviceDomains', [{}])[0].get('domain') or 'donttalk-api-production.up.railway.app')")
          echo "API_BASE_URL=https://$railway_domain" >> "$GITHUB_ENV"

      - name: Trigger market sync
        env:
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          curl --fail-with-body -sS -X POST "$API_BASE_URL/api/market/sync" \
            -H "Content-Type: application/json" \
            -H "X-Sync-Secret: $SYNC_SECRET" \
            --data '{"stock_symbols":["2330","2317","2454","3008","2603","2882"],"etf_symbols":["0050","0056","00878","006208"],"futures_symbols":["TX","MTX","ES=F","NQ=F"],"twse_months":1,"yahoo_range":"1mo"}'

  bio-sync:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '20 18 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Resolve Railway public domain
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
        run: |
          if [ -z "$RAILWAY_API_TOKEN" ]; then
            echo "API_BASE_URL=https://donttalk-api-production.up.railway.app" >> "$GITHUB_ENV"
            exit 0
          fi
          response=$(curl -sS https://backboard.railway.com/graphql/v2 \
            -H "Authorization: Bearer $RAILWAY_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"query":"query($projectId:String!,$environmentId:String!,$serviceId:String!){ domains(projectId:$projectId, environmentId:$environmentId, serviceId:$serviceId){ serviceDomains { domain } } }","variables":{"projectId":"'"$RAILWAY_PROJECT_ID"'","environmentId":"'"$RAILWAY_ENVIRONMENT_ID"'","serviceId":"'"$RAILWAY_SERVICE_ID"'"}}')
          railway_domain=$(printf '%s' "$response" | python3 -c "import json, sys; data = json.load(sys.stdin); print(data.get('data', {}).get('domains', {}).get('serviceDomains', [{}])[0].get('domain') or 'donttalk-api-production.up.railway.app')")
          echo "API_BASE_URL=https://$railway_domain" >> "$GITHUB_ENV"

      - name: Trigger sequence sync
        env:
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          curl --fail-with-body -sS -X POST "$API_BASE_URL/api/sequences/sync" \
            -H "Content-Type: application/json" \
            -H "X-Sync-Secret: $SYNC_SECRET" \
            --data '{"protein_query":"kinase","gene_symbols":["TP53","BRCA1","EGFR","APOE","KRAS","BRAF","MYC","PTEN"],"species":"homo_sapiens","limit":8}'

      - name: Trigger knowledge sync
        env:
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          curl --fail-with-body -sS -X POST "$API_BASE_URL/api/knowledge/sync" \
            -H "Content-Type: application/json" \
            -H "X-Sync-Secret: $SYNC_SECRET" \
            --data '{"protein_query":"kinase","literature_query":"kinase AND cancer","limit":4}'

      - name: Trigger sequencing run sync
        env:
          SYNC_SECRET: ${{ secrets.SYNC_SECRET }}
        run: |
          curl --fail-with-body -sS -X POST "$API_BASE_URL/api/sequencing-runs/sync" \
            -H "Content-Type: application/json" \
            -H "X-Sync-Secret: $SYNC_SECRET" \
            --data '{"query":"tax_name(\"Homo sapiens\") AND library_strategy=\"RNA-Seq\"","limit":6}'
