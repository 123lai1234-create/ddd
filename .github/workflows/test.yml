name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r site_api/requirements.txt
          pip install pytest ruff httpx requests

      - name: Lint with ruff
        run: ruff check site_api/ src/ tests/ --output-format=github

      - name: Syntax check
        run: |
          python -m py_compile site_api/main.py
          python -m py_compile site_api/db.py
          python -m py_compile site_api/models.py
          python -m py_compile site_api/services.py
          python -m py_compile site_api/routes.py
          python -m py_compile site_api/schemas.py
          python -m py_compile site_api/shared_utils.py
          python -m py_compile src/constants.py

      - name: Run tests
        run: pytest tests/ -v --tb=short
