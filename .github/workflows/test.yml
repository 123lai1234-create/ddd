name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install dependencies
        run: uv pip install -r site_api/requirements.txt pytest ruff httpx requests

      - name: Lint with ruff
        run: uv run ruff check site_api/ src/ tests/ --output-format=github

      - name: Run tests
        run: uv run pytest tests/ -q --tb=short
