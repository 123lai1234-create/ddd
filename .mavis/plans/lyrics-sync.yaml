  - id: merge
    title: 合併所有結果並生成最終報告
    prompt: |
      任務：合併所有歌詞同步對照結果，生成最終報告。

      來源目錄：D:\project\astro\public\music\lyrics_sync_results\

      步驟：
      1. 讀取 D:\project\astro\public\music\lyrics_sync_results\ 下所有 track_XXX.json 檔案
      2. 統計：
         - 總軌數、成功處理數、失敗數
         - 平均 match_score
         - match_score >= 80 的軌數（高匹配）
         - match_score < 50 的軌數（需關注）
      3. 生成最終報告：
         D:\project\astro\public\music\lyrics_sync_results\最終報告.md

      報告格式：
      # 歌詞同步對照最終報告

      ## 統計摘要
      - 總軌數：XX
      - 成功處理：XX
      - 失敗：XX
      - 平均匹配分數：XX
      - 高匹配（>=80）：XX 軌
      - 需關注（<50）：XX 軌

      ## 各軌結果列表
      | 軌 | 匹配分 | 狀態 |
      |----|--------|------|
      | 001 | 85 | 高匹配 |

      ## 問題軌分析（如有）
      （說明 match_score < 50 的軌可能問題）

      depends_on: [batch1, batch2, batch3, batch4, batch5]
    assigned_to: general
    verify_skip_reason: 合併任務直接讀取磁碟 JSON 檔案並生成 Markdown 報告，用戶可直接閱讀驗證。
    max_retries: 1
