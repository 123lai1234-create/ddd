version: 1
plan:
  name: 歌詞同步對照語音辨識
  max_concurrency: 5
  max_consecutive_failures: 3
  auto_reject_retries: 1
tasks:
  - id: batch1
    title: 批次1：軌001-013 歌詞同步對照
    prompt: |
      任務：為 D:\project\astro\public\music\ 下的 track_001.mp3 到 track_013.mp3（共13軌）進行歌詞同步對照。

      輸出目錄：D:\project\astro\public\music\lyrics_sync_results\

      請為每軌執行以下步驟：
      1. 使用 mavis mcp call matrix matrix_transcribe_audio 工具對 mp3 音檔進行語音辨識
         工具路徑：mavis mcp call matrix matrix_transcribe_audio
         參數格式：{"audio": "D:\\project\\astro\\public\\music\\track_XXX.mp3"}
         注意：音檔路徑要用雙反斜線
      2. 讀取對應的 lyrics_XXX.txt（已含時間戳歌詞）
      3. 比對語音辨識結果與歌詞文字，產生對照報告

      每軌結果存成 JSON 檔：
      D:\project\astro\public\music\lyrics_sync_results\track_XXX.json
      格式：
      {
        "track": "XXX",
        "transcription": "語音辨識結果文字",
        "lyrics": "歌詞檔案內容",
        "match_score": 0-100,
        "notes": "對照說明"
      }

      完成後報告：共處理了哪些軌、順利完成幾軌、遇到問題的軌。
    assigned_to: general
    verify_skip_reason: 各軌結果以 JSON 寫入磁碟，最終合併任務會做完整性檢查；下游 merge 任務依賴此輸出作為真實來源。
    max_retries: 2

