# Render Blueprint for donttalk-catchall (Vercel catchall fallback).
# Apply via Render dashboard "New → Blueprint" pointing at this file,
# or `render blueprint launch` from CLI.
services:
  - type: web
    name: donttalk-catchall
    runtime: node
    plan: free
    region: oregon
    rootDir: astro/catchall-server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Taipei
      - key: LOG_LEVEL
        value: info
      # DATABASE_URL is set via Render dashboard (sensitive)
      # LINE_CHANNEL_ACCESS_TOKEN is set via Render dashboard if needed
      # CRON_SECRET is set via Render dashboard if needed

  # 2026-10-06：每日收盤後自動維護 markers 表
  #   1. 清掉 'x' / 'test' / 空字串 placeholder
  #   2. 重跑 screener，insert 今日真實買賣訊號
  #   schedule 用 UTC → "30 6 * * 1-5" = 週一至週五 14:30 Asia/Taipei（收盤後）
  #   Render cron 環境變數會自動帶 RENDER_INSTANCE_ID，但這 endpoint 不需要密碼
  - type: cron
    name: donttalk-markers-maintenance
    runtime: node
    plan: free
    region: oregon
    rootDir: astro/catchall-server
    buildCommand: npm install
    startCommand: node scripts/cron_markers_maintenance.mjs
    schedule: "30 6 * * 1-5"
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Taipei
      - key: MAINTENANCE_URL
        value: https://donttalk-catchall.onrender.com/admin/markers/maintenance