# Render Blueprint for donttalk-catchall (Vercel catchall fallback).
# Apply via Render dashboard "New → Blueprint" pointing at this file,
# or `render blueprint launch` from CLI.
#
# ⚠️ 2026-10-06：Render cron job 用 REST API 建過才生效（render.yaml 改動不會 retroactive
#   套用到既有 service）。要重新建 cron 跑 create_cron.py：
#     RENDER_TOKEN=... python astro/catchall-server/create_cron.py
services:
  - type: web
    name: donttalk-catchall
    runtime: node
    plan: free
    region: oregon
    rootDir: astro/catchall-server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Taipei
      - key: LOG_LEVEL
        value: info
      # DATABASE_URL is set via Render dashboard (sensitive)
      # LINE_CHANNEL_ACCESS_TOKEN is set via Render dashboard if needed
      # CRON_SECRET is set via Render dashboard if needed

  # 2026-10-06：每日收盤後自動維護 markers 表
  #   1. 清掉 'x' / 'test' / 空字串 placeholder（含 'x || {...JSON...}' 污染形態）
  #   2. 重跑 screener，insert 今日真實買賣訊號
  #   schedule 用 UTC → "30 6 * * 1-5" = 週一至週五 14:30 Asia/Taipei（收盤後）
  #   serviceDetails.schedule 才是正確位置（top-level schedule 不被吃）
  #   對應 service id: crn-db26fmmi0phs73dg27mg（建立於 2026-10-06）
  - type: cron_job
    name: donttalk-markers-maintenance
    plan: free
    region: oregon
    repo: https://github.com/123lai1234-create/ddd
    branch: 123lai1234-create
    autoDeploy: true
    serviceDetails:
      env: node
      rootDir: astro/catchall-server
      schedule: "30 6 * * 1-5"
      envVars:
        - key: NODE_ENV
          value: production
        - key: TZ
          value: Asia/Taipei
        - key: MAINTENANCE_URL
          value: https://donttalk-catchall.onrender.com/admin/markers/maintenance
      envSpecificDetails:
        buildPlan: starter
        nodeVersion: "22"
        buildCommand: npm install
        startCommand: node scripts/cron_markers_maintenance.mjs

  # 2026-10-06：盤中即時 refresh（不 cleanup，只 INSERT 當日新訊號）
  #   schedule UTC: */30 1-5 * * 1-5 = 每 30 分鐘、09:00-13:59 Asia/Taipei 週一至週五
  #   對應 service id: crn-db280g3tqb8s73cdr79g（建立於 2026-10-06 via create_intraday_cron.py）
  - type: cron_job
    name: donttalk-markers-intraday
    plan: free
    region: oregon
    repo: https://github.com/123lai1234-create/ddd
    branch: 123lai1234-create
    autoDeploy: true
    serviceDetails:
      env: node
      rootDir: astro/catchall-server
      schedule: "*/30 1-5 * * 1-5"
      envVars:
        - key: NODE_ENV
          value: production
        - key: TZ
          value: Asia/Taipei
        - key: MAINTENANCE_URL
          value: https://donttalk-catchall.onrender.com/admin/markers/intraday
      envSpecificDetails:
        buildPlan: starter
        nodeVersion: "22"
        buildCommand: npm install
        startCommand: node scripts/cron_markers_intraday.mjs

  # 2026-10-06：每日 14:00 Asia/Taipei（收盤後）跑 loadAllCombined
  #   流程：macro_yields → macro_news → index_institutional → market_prices → sectors → markers → ai_capex
  #   schedule UTC: 0 6 * * 1-5
  #   對應 service id: crn-...（建立於 2026-10-06 via create_loadall_cron.py）
  - type: cron_job
    name: donttalk-load-all-cron
    plan: free
    region: oregon
    repo: https://github.com/123lai1234-create/ddd
    branch: 123lai1234-create
    autoDeploy: true
    serviceDetails:
      env: node
      rootDir: astro/catchall-server
      schedule: "0 6 * * 1-5"
      envVars:
        - key: NODE_ENV
          value: production
        - key: TZ
          value: Asia/Taipei
        - key: MAINTENANCE_URL
          value: https://donttalk-catchall.onrender.com
        - key: TIMEOUT_MS
          value: "240000"
      envSpecificDetails:
        buildPlan: starter
        nodeVersion: "22"
        buildCommand: npm install
        startCommand: node scripts/cron_load_all.mjs

  # 2026-10-08：每日 14:30 Asia/Taipei（收盤後 30 分鐘，load_all 跑完後）跑
  #   daily_health_check.mjs：19 個 API/HTML 健康檢查 + 自動修復
  #   - Tier 1: Render catchall 9 個核心 API（healthz, stock/2330, damo, etf_signal, signal_filter,
  #     macro_data, markers/history, uptrend_watch, warming_zone_scan, etf/0050）
  #   - Tier 2: Vercel 7 個關鍵 HTML 頁（/, /stock/, /stock/stock-damo-filter/,
  #     /stock/dashboard/, /stock/etf-filter/, /stock/signal-filter-v2/, /music/）
  #   - Tier 3: admin 診斷（/admin/health/tables, /admin/markers/backup）
  #   - Auto-fix: damo/etf/signal 沒資料 → POST /refresh；markers 空 → POST /admin/load/all
  #   - 結果寫 Neon health_check_log 表 → GET /api/admin/health/latest 讀
  #   - 對應 service id: crn-...（建立於 2026-10-08 via create_healthcheck_cron.py）
  - type: cron_job
    name: donttalk-healthcheck-cron
    plan: free
    region: oregon
    repo: https://github.com/123lai1234-create/ddd
    branch: 123lai1234-create
    autoDeploy: true
    serviceDetails:
      env: node
      rootDir: astro/catchall-server
      schedule: "30 6 * * 1-5"
      envVars:
        - key: NODE_ENV
          value: production
        - key: TZ
          value: Asia/Taipei
        - key: RENDER_BASE
          value: https://donttalk-catchall.onrender.com
        - key: VERCEL_BASE
          value: https://donttalk.vercel.app
        - key: TIMEOUT_MS
          value: "15000"
        - key: FIX_ENABLED
          value: "1"
      envSpecificDetails:
        buildPlan: starter
        nodeVersion: "22"
        buildCommand: npm install
        startCommand: node scripts/daily_health_check.mjs