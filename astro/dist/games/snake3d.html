<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Snake 3D · Arcade</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐍</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#04020c;color:#e8eafc;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
#canvas{position:fixed;inset:0;display:block}
.hud{position:fixed;top:16px;left:16px;z-index:5;font-family:'Courier New',monospace}
.hud-row{display:flex;gap:12px;margin-bottom:6px}
.pill{padding:6px 14px;background:rgba(0,0,0,.55);border:1px solid rgba(34,255,167,.4);border-radius:20px;font-size:.85rem;backdrop-filter:blur(8px)}
.pill.danger{border-color:rgba(255,45,149,.5);color:#ff2d95}
.pill.warn{border-color:rgba(253,224,71,.5);color:#fde047}
.back{position:fixed;top:16px;right:16px;z-index:5;color:#8b92c0;text-decoration:none;font-size:.85rem;padding:8px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.55);backdrop-filter:blur(8px)}
.back:hover{color:#00e5ff;border-color:rgba(0,229,255,.4)}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,2,12,.85);backdrop-filter:blur(8px);z-index:10}
.panel{padding:36px 48px;border-radius:16px;background:linear-gradient(135deg,rgba(255,45,149,.08),rgba(0,229,255,.08));border:1px solid rgba(255,255,255,.12);text-align:center;max-width:440px;width:90%}
.panel h1{font-size:2rem;margin-bottom:12px;background:linear-gradient(135deg,#22ffa7,#00e5ff);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:2px}
.panel p{color:#a0a8c8;margin-bottom:18px;line-height:1.6;font-size:.9rem}
.panel input{width:100%;padding:10px 14px;background:rgba(0,0,0,.4);border:1px solid rgba(34,255,167,.3);border-radius:8px;color:inherit;font-size:.95rem;margin-bottom:14px;font-family:inherit}
.panel input:focus{outline:none;border-color:#22ffa7}
.btn{padding:11px 28px;background:linear-gradient(135deg,#22ffa7,#00e5ff);color:#04020c;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:.95rem;letter-spacing:1px;margin:4px}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(34,255,167,.3)}
.btn-ghost{background:transparent;color:#e8eafc;border:1px solid rgba(255,255,255,.2)}
.lb{margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08);text-align:left;font-size:.8rem}
.lb-title{color:#fde047;font-family:'Courier New',monospace;letter-spacing:2px;margin-bottom:6px}
.lb-entry{display:flex;justify-content:space-between;padding:3px 0;color:#a0a8c8;font-family:'Courier New',monospace}
.keys{font-size:.75rem;color:#8b92c0;margin-top:12px}
.keys span{display:inline-block;padding:2px 8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:4px;margin:2px;font-family:'Courier New',monospace}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<a href="/games/" class="back">← 遊戲中心</a>
<div class="hud">
<div class="hud-row">
<div class="pill">分數 <b id="score">0</b></div>
<div class="pill">長度 <b id="len">3</b></div>
<div class="pill warn">關卡 <b id="lvl">1</b></div>
</div>
<div class="hud-row"><div class="pill" style="font-size:.72rem;color:#8b92c0">WASD / 方向鍵 轉向 · SPACE 暫停</div></div>
</div>

<div class="overlay" id="overlay">
<div class="panel">
<h1>NEON SNAKE 3D</h1>
<p>用 WASD 或方向鍵在立體格子內移動，吃到發光果實變長。撞到牆或自己遊戲結束。每 5 顆果實升一關，速度提升。</p>
<input id="player" placeholder="輸入玩家名稱（最多 24 字）" maxlength="24" value="">
<button class="btn" onclick="startGame()">▶ 開始遊戲</button>
<div class="lb">
<div class="lb-title">TOP 5</div>
<div id="lbList">載入中…</div>
</div>
<div class="keys"><span>W/↑</span><span>A/←</span><span>S/↓</span><span>D/→</span><span>Space</span></div>
</div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

const GRID = 14;
const CELL = 1;
let scene, camera, renderer, snakeMeshes = [], foodMesh, walls;
let snake, dir, nextDir, food, score, level, gameOver, paused, tickMs, lastTick, playerName;

const canvas = document.getElementById('canvas');
const overlay = document.getElementById('overlay');
const scoreEl = document.getElementById('score');
const lenEl = document.getElementById('len');
const lvlEl = document.getElementById('lvl');

function initScene() {
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x04020c, 0.055);
  camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 100);
  camera.position.set(GRID*0.95, GRID*1.15, GRID*1.05);
  camera.lookAt(0,0,0);

  renderer = new THREE.WebGLRenderer({canvas, antialias: false, powerPreference: 'high-performance'});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  renderer.setSize(innerWidth, innerHeight);

  // Grid floor with neon lines
  const half = GRID * CELL / 2;
  const gridHelper = new THREE.GridHelper(GRID*CELL, GRID, 0xff2d95, 0x2a1a4a);
  gridHelper.position.y = -half;
  scene.add(gridHelper);

  // Wireframe boundary cube
  const boxGeom = new THREE.BoxGeometry(GRID*CELL, GRID*CELL, GRID*CELL);
  const edges = new THREE.EdgesGeometry(boxGeom);
  walls = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({color: 0x00e5ff, transparent: true, opacity: 0.4}));
  scene.add(walls);

  // Ambient + neon point light
  scene.add(new THREE.AmbientLight(0x404060, 0.6));
  const keyLight = new THREE.PointLight(0xff2d95, 1.4, 40);
  keyLight.position.set(GRID, GRID, GRID);
  scene.add(keyLight);
  const fillLight = new THREE.PointLight(0x00e5ff, 1.0, 40);
  fillLight.position.set(-GRID, GRID, -GRID);
  scene.add(fillLight);

  // Food mesh (emissive icosahedron)
  const foodGeom = new THREE.IcosahedronGeometry(CELL*0.42, 0);
  const foodMat = new THREE.MeshStandardMaterial({color: 0xfde047, emissive: 0xfde047, emissiveIntensity: 1.6, metalness:0.3, roughness:0.2});
  foodMesh = new THREE.Mesh(foodGeom, foodMat);
  scene.add(foodMesh);

  // Starfield (very cheap)
  const starGeom = new THREE.BufferGeometry();
  const starPos = new Float32Array(400 * 3);
  for (let i=0;i<400;i++){
    starPos[i*3]   = (Math.random()-0.5)*80;
    starPos[i*3+1] = (Math.random()-0.5)*80;
    starPos[i*3+2] = (Math.random()-0.5)*80;
  }
  starGeom.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
  scene.add(new THREE.Points(starGeom, new THREE.PointsMaterial({color: 0xa855f7, size: 0.08, transparent:true, opacity:0.7, sizeAttenuation:true})));

  addEventListener('resize', () => {
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}

function worldPos(cell) {
  const offset = -(GRID-1)*CELL/2;
  return new THREE.Vector3(cell.x*CELL + offset, cell.y*CELL + offset, cell.z*CELL + offset);
}

function spawnFood() {
  while (true) {
    const f = {x: Math.floor(Math.random()*GRID), y: Math.floor(Math.random()*GRID), z: Math.floor(Math.random()*GRID)};
    if (!snake.some(s => s.x===f.x && s.y===f.y && s.z===f.z)) { food = f; break; }
  }
  foodMesh.position.copy(worldPos(food));
}

function rebuildSnakeMeshes() {
  snakeMeshes.forEach(m => { scene.remove(m); m.geometry.dispose(); m.material.dispose(); });
  snakeMeshes = [];
  const geom = new THREE.BoxGeometry(CELL*0.82, CELL*0.82, CELL*0.82);
  snake.forEach((s, i) => {
    const hue = (120 + i*8) % 360;
    const mat = new THREE.MeshStandardMaterial({
      color: new THREE.Color(`hsl(${hue}, 100%, 55%)`),
      emissive: new THREE.Color(`hsl(${hue}, 100%, 40%)`),
      emissiveIntensity: i === 0 ? 1.4 : 0.7,
      metalness: 0.4, roughness: 0.3
    });
    const m = new THREE.Mesh(geom, mat);
    m.position.copy(worldPos(s));
    scene.add(m);
    snakeMeshes.push(m);
  });
}

function resetGame() {
  snake = [{x:GRID/2|0,y:GRID/2|0,z:GRID/2|0},{x:(GRID/2|0)-1,y:GRID/2|0,z:GRID/2|0},{x:(GRID/2|0)-2,y:GRID/2|0,z:GRID/2|0}];
  dir = {x:1,y:0,z:0};
  nextDir = {...dir};
  score = 0; level = 1; gameOver = false; paused = false;
  tickMs = 180;
  lastTick = performance.now();
  spawnFood();
  rebuildSnakeMeshes();
  updateHUD();
}

function updateHUD() {
  scoreEl.textContent = score;
  lenEl.textContent = snake.length;
  lvlEl.textContent = level;
}

function step() {
  dir = nextDir;
  const head = snake[0];
  const nh = {x: head.x+dir.x, y: head.y+dir.y, z: head.z+dir.z};
  if (nh.x<0||nh.x>=GRID||nh.y<0||nh.y>=GRID||nh.z<0||nh.z>=GRID) return endGame();
  if (snake.some(s => s.x===nh.x && s.y===nh.y && s.z===nh.z)) return endGame();
  snake.unshift(nh);
  if (nh.x===food.x && nh.y===food.y && nh.z===food.z) {
    score += 10 * level;
    if (snake.length % 5 === 0) { level++; tickMs = Math.max(60, tickMs - 14); }
    spawnFood();
  } else {
    snake.pop();
  }
  rebuildSnakeMeshes();
  updateHUD();
}

async function endGame() {
  gameOver = true;
  overlay.innerHTML = `
  <div class="panel">
    <h1 style="background:linear-gradient(135deg,#ff2d95,#fde047);-webkit-background-clip:text;background-clip:text;color:transparent">GAME OVER</h1>
    <p>分數 <b style="color:#22ffa7">${score}</b> · 長度 ${snake.length} · 關卡 ${level}</p>
    <div id="rankMsg" style="color:#fde047;margin-bottom:8px;font-size:.85rem">上傳分數中…</div>
    <button class="btn" onclick="location.reload()">↺ 再來一局</button>
    <a class="btn btn-ghost" href="/games/" style="text-decoration:none;display:inline-block">← 遊戲中心</a>
  </div>`;
  overlay.style.display = 'flex';
  try {
    const res = await fetch('/api/games/scores', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({game:'snake3d', player: playerName, score, level, meta:{length: snake.length}})
    });
    const data = await res.json();
    const rm = document.getElementById('rankMsg');
    if (rm) rm.textContent = data.rank ? `全站排行第 #${data.rank}!` : '分數已上傳';
  } catch(e) {
    const rm = document.getElementById('rankMsg');
    if (rm) rm.textContent = '分數上傳失敗（離線模式）';
  }
}

function loop(t) {
  requestAnimationFrame(loop);
  if (!scene) return;
  foodMesh.rotation.x += 0.03;
  foodMesh.rotation.y += 0.04;
  walls.rotation.y = Math.sin(t*0.0003)*0.05;
  if (!gameOver && !paused && t - lastTick >= tickMs) {
    step();
    lastTick = t;
    if (gameOver) return;
  }
  renderer.render(scene, camera);
}

const KEYMAP = {
  'ArrowUp':   {x:0,y:0,z:-1}, 'KeyW': {x:0,y:0,z:-1},
  'ArrowDown': {x:0,y:0,z: 1}, 'KeyS': {x:0,y:0,z: 1},
  'ArrowLeft': {x:-1,y:0,z:0}, 'KeyA': {x:-1,y:0,z:0},
  'ArrowRight':{x: 1,y:0,z:0}, 'KeyD': {x: 1,y:0,z:0},
  'KeyQ':      {x:0,y:1,z:0},
  'KeyE':      {x:0,y:-1,z:0},
};
addEventListener('keydown', e => {
  if (e.code === 'Space') { paused = !paused; e.preventDefault(); return; }
  const d = KEYMAP[e.code];
  if (!d) return;
  if (d.x === -dir.x && d.y === -dir.y && d.z === -dir.z) return;
  nextDir = d;
});

async function loadLB() {
  const el = document.getElementById('lbList');
  try {
    const res = await fetch('/api/games/leaderboard/snake3d?limit=5');
    const data = await res.json();
    if (!data.entries || !data.entries.length) { el.innerHTML = '<div style="color:#8b92c0">尚無紀錄 — 當第一位吧</div>'; return; }
    el.innerHTML = data.entries.map((e,i) => `<div class="lb-entry"><span>#${i+1} ${escapeHtml(e.player)}</span><span style="color:#22ffa7">${e.score}</span></div>`).join('');
  } catch(err) {
    el.innerHTML = '<div style="color:#8b92c0">排行榜暫無法取得</div>';
  }
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

window.startGame = function() {
  const input = document.getElementById('player');
  playerName = (input.value || '').trim() || 'anon';
  localStorage.setItem('arcade_player', playerName);
  overlay.style.display = 'none';
  if (!scene) { initScene(); requestAnimationFrame(loop); }
  resetGame();
};

document.getElementById('player').value = localStorage.getItem('arcade_player') || '';
loadLB();
</script>
</body>
</html>
