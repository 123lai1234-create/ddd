    <script>
    (function(){
        const c = document.getElementById('c');
        const ctx = c.getContext('2d');
        let W, H, pts = [];
        function resize(){ W = c.width = window.innerWidth; H = c.height = window.innerHeight; pts = Array.from({length:40},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3})); }
        resize();
        window.addEventListener('resize', resize);
        function draw(){
            ctx.clearRect(0,0,W,H);
            pts.forEach(p=>{
                p.x=(p.x+p.vx+W)%W; p.y=(p.y+p.vy+H)%H;
                ctx.beginPath(); ctx.arc(p.x,p.y,1.5,0,Math.PI*2);
                ctx.fillStyle='rgba(88,215,255,.25)'; ctx.fill();
            });
            for(let i=0;i<pts.length;i++) for(let j=i+1;j<pts.length;j++){
                const dx=pts[i].x-pts[j].x, dy=pts[i].y-pts[j].y, d=Math.sqrt(dx*dx+dy*dy);
                if(d<120){ ctx.beginPath(); ctx.moveTo(pts[i].x,pts[i].y); ctx.lineTo(pts[j].x,pts[j].y); ctx.strokeStyle=`rgba(88,215,255,${.12*(1-d/120)})`; ctx.lineWidth=.5; ctx.stroke(); }
            }
            requestAnimationFrame(draw);
        }
        draw();
    })();
    </script>

;padding:2px 6px">Esc</kbd> </div> <div id="pf-results" style="overflow-y:auto;padding:8px 0;flex:1"></div> </div> </div> <!-- Search trigger button (bottom-right) --> <button id="pf-btn" title="搜尋 (Ctrl+K)" aria-label="搜尋" style="position:fixed;bottom:24px;right:24px;z-index:500;background:var(--surface,rgba(255,255,255,.06));border:1px solid var(--border,rgba(255,255,255,.12));border-radius:50%;width:44px;height:44px;font-size:1.1rem;cursor:pointer;color:var(--muted,#8b949e);display:flex;align-items:center;justify-content:center;transition:all .15s;box-shadow:0 4px 16px rgba(0,0,0,.3)">🔍</button> <script>
    (function() {
      const modal  = document.getElementById('pf-modal');
      const input  = document.getElementById('pf-input');
      const results= document.getElementById('pf-results');
      const btn    = document.getElementById('pf-btn');
      let pf = null, debounce = null;

      async function openModal() {
        modal.style.display = 'flex';
        input.focus();
        if (!pf) {
          try {
            pf = await import('/pagefind/pagefind.js');
            await pf.init();
          } catch(e) { results.innerHTML = '<p style="padding:16px 20px;color:#8b949e;font-size:.85rem">搜尋索引尚未建立（需要先 build）。</p>'; pf = null; }
        }
      }
      function closeModal() { modal.style.display = 'none'; input.value = ''; results.innerHTML = ''; }

      async function doSearch(q) {
        if (!pf || !q.trim()) { results.innerHTML = ''; return; }
        const sr = await pf.search(q);
        const items = await Promise.all(sr.results.slice(0, 8).map(r => r.data()));
        results.innerHTML = items.length
          ? items.map(d => `<a href="${d.url}" style="display:block;padding:10px 18px;text-decoration:none;color:var(--text,#e6edf3);border-bottom:1px solid var(--border,rgba(255,255,255,.05));transition:background .1s" onmouseover="this.style.background='rgba(255,255,255,.04)'" onmouseout="this.style.background=''">
              <div style="font-size:.9rem;font-weight:600;margin-bottom:3px">${d.meta?.title || d.url}</div>
              <div style="font-size:.78rem;color:#8b949e">${d.excerpt}</div>
            </a>`).join('')
          : '<p style="padding:16px 20px;color:#8b949e;font-size:.85rem">找不到結果。</p>';
      }

      btn.addEventListener('click', openModal);
      modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
      document.addEventListener('keydown', e => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); openModal(); }
        if (e.key === 'Escape') closeModal();
      });
      input.addEventListener('input', () => {
        clearTimeout(debounce);
        debounce = setTimeout(() => doSearch(input.value), 250);
      });
    })();
    </script> </body> </html>
