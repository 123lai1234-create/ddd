<!DOCTYPE html><html lang="zh-TW"> <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Web Scraper Demo · 網頁爬蟲互動</title><meta name="description" content="輸入 URL 即時解析網頁：標題、描述、OG 標籤、H1、連結清單、純文字預覽。後端有 SSRF 防護、超時、rate limit。"><meta property="og:title" content="Web Scraper Demo · 網頁爬蟲互動"><meta property="og:description" content="輸入 URL 即時解析網頁：標題、描述、OG 標籤、H1、連結清單、純文字預覽。後端有 SSRF 防護、超時、rate limit。"><meta property="og:type" content="website"><meta name="twitter:card" content="summary_large_image"><meta property="og:image" content="https://donttalk.vercel.app/og-image.svg"><meta name="twitter:image" content="https://donttalk.vercel.app/og-image.svg"><link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧬</text></svg>"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles/shared.css"><link rel="stylesheet" href="/styles/polish.css"><link rel="stylesheet" href="/styles/dynamic.css"><script src="/scripts/admin-mode.js"></script><script src="/scripts/site-shell-config.js" defer></script><script src="/scripts/nav.js" defer></script><script src="/scripts/app-config.js" defer></script><script src="/scripts/dynamic-features.js" defer></script></head> <body data-page="scraper">  
    <div data-site-nav></div>

    <section class="sc-hero">
        <h1>Web Scraper Demo</h1>
        <p>輸入任何 URL，後端用 <code>httpx</code> 抓取並解析出 title、meta、OG 標籤、H1、連結與文字預覽。含 SSRF 防護、8s 超時、2 MB 大小上限。</p>
        <div class="sc-tech">
            <span>FastAPI</span>
            <span>httpx</span>
            <span>regex parse</span>
            <span>SSRF guard</span>
            <span>slowapi rate-limit</span>
        </div>
    </section>

    <div class="sc-wrap">
        <div class="sc-input-row">
            <input id="scUrl" class="sc-input" type="url" placeholder="https://example.com" value="">
            <button id="scBtn" class="sc-btn" onclick="doScrape()">▶ 抓取解析</button>
        </div>
        <div class="sc-samples">
            <span class="sc-sample" data-url="https://en.wikipedia.org/wiki/Cortex-M">en.wikipedia.org/wiki/Cortex-M</span>
            <span class="sc-sample" data-url="https://www.nuvoton.com/products/microcontrollers/arm-cortex-m0-mcus/nano130-advanced-series/nano130ke3bn/?__locale=zh_TW">Nuvoton Nano130</span>
            <span class="sc-sample" data-url="https://news.ycombinator.com/">Hacker News</span>
            <span class="sc-sample" data-url="https://astro.build/">astro.build</span>
            <span class="sc-sample" data-url="https://example.com">example.com</span>
        </div>

        <div id="scResult"></div>
    </div>

    <div data-site-footer></div>
    <button class="scroll-top" aria-label="返回頂部">↑</button>

    <script>
        document.querySelectorAll('.sc-sample').forEach(el => {
            el.addEventListener('click', () => {
                document.getElementById('scUrl').value = el.dataset.url;
                doScrape();
            });
        });

        function esc(s) {
            return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        async function doScrape() {
            const url = document.getElementById('scUrl').value.trim();
            const btn = document.getElementById('scBtn');
            const out = document.getElementById('scResult');
            if (!url) { out.innerHTML = '<div class="sc-err">請輸入 URL</div>'; return; }
            btn.disabled = true; btn.textContent = '抓取中…';
            out.innerHTML = '<div class="sc-card"><div class="sc-spec">⏳ 正在解析 ' + esc(url) + ' …</div></div>';

            let apiBase = '';
            try {
                if (typeof resolvePortfolioApiBase === 'function') {
                    apiBase = await resolvePortfolioApiBase() || '';
                } else if (window.APP_CONFIG?.API_BASE_URL) {
                    apiBase = window.APP_CONFIG.API_BASE_URL.replace(/\/+$/, '');
                }
            } catch(e) {}
            const endpoint = (apiBase || '') + '/api/scrape';

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({url})
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.detail || res.statusText);
                render(data);
            } catch(err) {
                out.innerHTML = '<div class="sc-err">失敗：' + esc(err.message) + '</div>';
            } finally {
                btn.disabled = false; btn.textContent = '▶ 抓取解析';
            }
        }

        function render(d) {
            const out = document.getElementById('scResult');
            const parts = [];

            parts.push(`<div class="sc-card">
                <h3>📋 Metadata</h3>
                <div class="sc-meta">
                    <div><div class="lbl">Title</div><div class="val">${esc(d.title) || '<em style="color:var(--dim)">(none)</em>'}</div></div>
                    <div><div class="lbl">Description</div><div class="val">${esc(d.description) || '<em style="color:var(--dim)">(none)</em>'}</div></div>
                    <div><div class="lbl">OG Title</div><div class="val">${esc(d.og_title) || '<em style="color:var(--dim)">(none)</em>'}</div></div>
                    <div><div class="lbl">Status</div><div class="val">${d.status_code} · ${(d.size_bytes/1024).toFixed(1)} KB</div></div>
                    <div><div class="lbl">Final URL</div><div class="val">${esc(d.url)}</div></div>
                    <div><div class="lbl">Text Length</div><div class="val">${d.text_length.toLocaleString()} chars</div></div>
                </div>
                ${d.og_image ? `<img src="${esc(d.og_image)}" class="sc-og" alt="OG Image" onerror="this.style.display='none'">` : ''}
            </div>`);

            if (d.h1 && d.h1.length) {
                parts.push(`<div class="sc-card">
                    <h3>🔤 H1 Headings (${d.h1.length})</h3>
                    <ul class="sc-h1-list">${d.h1.map(h => `<li>${esc(h)}</li>`).join('')}</ul>
                </div>`);
            }

            if (d.links && d.links.length) {
                parts.push(`<div class="sc-card">
                    <h3>🔗 Links (top ${d.links.length})</h3>
                    <div class="sc-links">${d.links.map(l => `
                        <a href="${esc(l.href)}" target="_blank" rel="noopener">
                            <span>${esc(l.text)}</span>
                            <span class="href">${esc(l.href)}</span>
                        </a>`).join('')}</div>
                </div>`);
            }

            if (d.text_preview) {
                parts.push(`<div class="sc-card">
                    <h3>📝 Text Preview (first 800 chars)</h3>
                    <div class="sc-text">${esc(d.text_preview)}</div>
                </div>`);
            }

            out.innerHTML = parts.join('');
        }

        document.getElementById('scUrl').addEventListener('keydown', e => {
            if (e.key === 'Enter') doScrape();
        });
    </script>
   </body> </html>
