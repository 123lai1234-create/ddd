<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LINE 推播管理｜台股均線實戰系統</title>
  <link rel="icon" type="image/svg+xml" href="/stock/favicon.svg">
  <style>
    :root{--bg:#0f0f23;--bg2:#1a1a3e;--bg3:#1e1e42;--txt:#e0e0ff;--txt2:#8888aa;
          --green:#00c853;--red:#ff1744;--orange:#ff9100;--purple:#d500f9;
          --blue:#448aff;--cyan:#00bcd4;--bdr:#2a2a5a;--yellow:#ffd600;--line:#06C755}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI','Microsoft JhengHei',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
    .header{background:linear-gradient(135deg,var(--bg2),#12122e);padding:14px 24px;
      display:flex;align-items:center;justify-content:space-between;
      border-bottom:1px solid var(--bdr);position:sticky;top:0;z-index:100}
    .header h1{font-size:20px;background:linear-gradient(90deg,var(--line),var(--green));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:700}
    .header .sub{font-size:12px;color:var(--txt2);margin-top:2px}
    .nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
    .nav a{background:transparent;border:1px solid var(--bdr);color:var(--txt);
      padding:5px 11px;border-radius:6px;text-decoration:none;font-size:12px;transition:all .2s}
    .nav a:hover{background:var(--line);border-color:var(--line)}
    .container{max-width:1000px;margin:0 auto;padding:20px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    @media(max-width:800px){.grid{grid-template-columns:1fr}}
    .card{background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;padding:18px}
    .card h2{font-size:15px;color:var(--cyan);margin-bottom:14px;display:flex;align-items:center;gap:8px}
    .line-status{display:flex;align-items:center;gap:8px;padding:12px;background:var(--bg3);
      border-radius:8px;margin-bottom:14px}
    .line-dot{width:12px;height:12px;border-radius:50%;background:var(--line);
      box-shadow:0 0 12px var(--line);animation:pulse 1.5s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .form-group{margin-bottom:14px}
    .form-group label{display:block;font-size:12px;color:var(--txt2);margin-bottom:6px}
    .form-group input,.form-group select,.form-group textarea{width:100%;background:var(--bg);
      border:1px solid var(--bdr);color:var(--txt);padding:8px 12px;border-radius:6px;
      font-family:inherit;font-size:13px;box-sizing:border-box}
    .form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--line)}
    .btn{background:var(--line);color:#fff;border:none;padding:10px 20px;border-radius:6px;
      cursor:pointer;font-weight:600;font-size:13px;transition:opacity .2s}
    .btn:hover{opacity:.85}
    .btn:disabled{background:var(--txt2);cursor:not-allowed;opacity:.5}
    .btn-secondary{background:var(--bg3);color:var(--txt);border:1px solid var(--bdr)}
    .btn-danger{background:var(--red)}
    .recipient-list{display:flex;flex-direction:column;gap:8px}
    .recipient{background:var(--bg3);padding:12px;border-radius:8px;display:flex;
      align-items:center;justify-content:space-between}
    .recipient .info{flex:1}
    .recipient .name{font-size:13px;font-weight:600;color:var(--txt)}
    .recipient .id{font-size:11px;color:var(--txt2);font-family:monospace}
    .recipient .actions{display:flex;gap:6px}
    .icon-btn{background:transparent;border:1px solid var(--bdr);color:var(--txt);
      padding:4px 8px;border-radius:4px;cursor:pointer;font-size:11px;transition:all .15s}
    .icon-btn:hover{background:var(--bg2)}
    .icon-btn.danger:hover{background:rgba(255,23,68,.15);color:var(--red);border-color:var(--red)}
    .message-preview{background:var(--bg3);border-left:3px solid var(--line);padding:12px;
      border-radius:6px;font-family:'Microsoft JhengHei',sans-serif;white-space:pre-wrap;
      font-size:13px;line-height:1.6;margin-top:14px;max-height:300px;overflow-y:auto}
    .log-row{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid var(--bg3);
      font-size:12px}
    .log-row .time{color:var(--txt2);font-family:monospace;min-width:60px}
    .log-row .target{color:var(--cyan);font-family:monospace}
    .log-row .status{padding:2px 8px;border-radius:8px;font-size:10px;font-weight:600}
    .log-row .status.success{background:rgba(0,200,83,.2);color:var(--green)}
    .log-row .status.failed{background:rgba(255,23,68,.2);color:var(--red)}
    .loading-text{text-align:center;padding:20px;color:var(--txt2);font-size:13px}
    .empty-text{text-align:center;padding:30px;color:var(--txt2);font-size:13px}
    .footer{text-align:center;padding:20px;color:var(--txt2);font-size:11px}
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>💬 LINE 推播管理</h1>
      <div class="sub">即時訊號推送到 LINE 群組 · 觸發條件與收件者設定</div>
    </div>
    <div class="nav">
      <a href="/stock/dashboard.html">📊 儀表板</a>
      <a href="/stock/heatmap.html">🔥 熱力圖</a>
      <a href="/stock/ai-warroom.html">🤖 AI 戰室</a>
      <a href="/stock/sitemap.html">🗂 全站</a>
    </div>
  </div>
  <div class="container">
    <div class="line-status">
      <div class="line-dot"></div>
      <div>
        <div style="font-size:14px;font-weight:600;color:var(--line)">LINE Bot 已連線</div>
        <div style="font-size:11px;color:var(--txt2)" id="botInfo">載入中…</div>
      </div>
    </div>

    <div class="grid">
      <!-- 左側：新增收件者 / 推播 -->
      <div class="card">
        <h2>📨 發送推播訊息</h2>
        <div class="form-group">
          <label>訊息內容</label>
          <textarea id="msgBody" rows="5" placeholder="例如：📈 台積電 (2330) 觸發黃金交叉，建議進場&#10;收盤價: 850.50&#10;MA5: 845.20">📈 台積電 (2330) 觸發黃金交叉，建議進場
收盤價: 850.50
MA5: 845.20
訊號強度: 強</textarea>
        </div>
        <div class="form-group">
          <label>發送對象</label>
          <select id="msgTarget">
            <option value="all">全部已註冊收件者</option>
          </select>
        </div>
        <div style="display:flex;gap:8px;margin-bottom:14px">
          <button class="btn" onclick="sendBroadcast()">📤 立即推播</button>
          <button class="btn btn-secondary" onclick="previewMsg()">👁 預覽</button>
        </div>
        <div class="message-preview" id="msgPreview" style="display:none"></div>
      </div>

      <!-- 右側：收件者清單 -->
      <div class="card">
        <h2>👥 收件者清單 <span class="badge" id="recipientCount">—</span></h2>
        <div class="recipient-list" id="recipientList">
          <div class="loading-text">載入中…</div>
        </div>
        <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--bdr)">
          <h2 style="font-size:14px;color:var(--cyan);margin-bottom:10px">➕ 新增收件者</h2>
          <div class="form-group">
            <label>名稱</label>
            <input type="text" id="newName" placeholder="例如：主策略群">
          </div>
          <div class="form-group">
            <label>LINE User ID / Group ID</label>
            <input type="text" id="newLineId" placeholder="U1234567890abcd... 或 C1234567890abcd...">
          </div>
          <div style="display:flex;gap:8px">
            <button class="btn" onclick="addRecipient()">新增</button>
            <button class="btn btn-secondary" onclick="refreshRecipients()">🔄 重新整理</button>
          </div>
        </div>
      </div>

      <!-- 觸發條件 -->
      <div class="card">
        <h2>⚡ 自動推播觸發條件</h2>
        <div class="form-group">
          <label>
            <input type="checkbox" id="trigger1" checked> MACD 黃金交叉
          </label>
        </div>
        <div class="form-group">
          <label>
            <input type="checkbox" id="trigger2" checked> 收盤突破 5MA / 20MA
          </label>
        </div>
        <div class="form-group">
          <label>
            <input type="checkbox" id="trigger3" checked> RSI 跌破 30（超賣訊號）
          </label>
        </div>
        <div class="form-group">
          <label>
            <input type="checkbox" id="trigger4" checked> 接近漲停 / 跌停
          </label>
        </div>
        <div class="form-group">
          <label>
            <input type="checkbox" id="trigger5"> 外資連續 3 日買超
          </label>
        </div>
        <div class="form-group">
          <label>推播時間</label>
          <select id="pushTime">
            <option value="realtime">即時（觸發後立即）</option>
            <option value="morning">每日 09:00 早報</option>
            <option value="close">每日 13:30 收盤後</option>
            <option value="evening">每日 17:00 晚間彙整</option>
          </select>
        </div>
        <button class="btn" onclick="saveTriggers()">💾 儲存觸發設定</button>
      </div>

      <!-- 推播歷史 -->
      <div class="card">
        <h2>📜 近期推播紀錄 <span class="badge" id="logCount">—</span></h2>
        <div id="logList">
          <div class="loading-text">載入中…</div>
        </div>
      </div>
    </div>

    <div class="footer">資料來源：LINE Messaging API · 推播紀錄保留 30 日</div>
  </div>
  <script>
  const API = '';
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  async function refreshRecipients() {
    try {
      const r = await fetch(API + '/api/recipients');
      const j = await r.json();
      const list = j.recipients || j.items || [];
      document.getElementById('recipientCount').textContent = list.length + ' 位';
      const target = document.getElementById('msgTarget');
      target.innerHTML = '<option value="all">全部已註冊收件者</option>' +
        list.map(x => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');
      if (!list.length) {
        document.getElementById('recipientList').innerHTML = '<div class="empty-text">尚無收件者，請從下方新增</div>';
      } else {
        document.getElementById('recipientList').innerHTML = list.map(x => `
          <div class="recipient">
            <div class="info">
              <div class="name">${esc(x.name)}</div>
              <div class="id">${esc(x.line_id || x.email || '')}</div>
            </div>
            <div class="actions">
              <button class="icon-btn" onclick="testRecipient('${esc(x.id)}')">測試</button>
              <button class="icon-btn danger" onclick="deleteRecipient('${esc(x.id)}')">刪除</button>
            </div>
          </div>
        `).join('');
      }
    } catch (e) {
      document.getElementById('recipientList').innerHTML = '<div class="empty-text">載入失敗: ' + esc(e.message) + '</div>';
    }
  }

  async function addRecipient() {
    const name = document.getElementById('newName').value.trim();
    const line_id = document.getElementById('newLineId').value.trim();
    if (!name || !line_id) { alert('請填寫完整'); return; }
    try {
      const r = await fetch(API + '/api/recipients', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, line_id, email: line_id.includes('@') ? line_id : '' })
      });
      if (r.ok) {
        document.getElementById('newName').value = '';
        document.getElementById('newLineId').value = '';
        refreshRecipients();
      } else {
        alert('新增失敗');
      }
    } catch (e) { alert('錯誤: ' + e.message); }
  }

  async function deleteRecipient(id) {
    if (!confirm('確認刪除？')) return;
    try {
      await fetch(API + '/api/recipients/' + id, { method: 'DELETE' });
      refreshRecipients();
    } catch (e) { alert('刪除失敗: ' + e.message); }
  }

  async function testRecipient(id) {
    try {
      await fetch(API + '/api/recipients/' + id + '/test', { method: 'POST' });
      alert('測試訊息已發送');
    } catch (e) { alert('發送失敗: ' + e.message); }
  }

  function previewMsg() {
    const body = document.getElementById('msgBody').value.trim();
    const preview = document.getElementById('msgPreview');
    if (!body) { alert('請輸入訊息'); return; }
    preview.textContent = body;
    preview.style.display = 'block';
  }

  async function sendBroadcast() {
    const body = document.getElementById('msgBody').value.trim();
    const target = document.getElementById('msgTarget').value;
    if (!body) { alert('請輸入訊息內容'); return; }
    try {
      const r = await fetch(API + '/api/line/broadcast', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: body, target_id: target === 'all' ? null : target })
      });
      const j = await r.json();
      if (r.ok) {
        alert('已送出 · ' + (j.sent || j.count || '') + ' 位收件者');
        loadLog();
      } else {
        alert('發送失敗: ' + (j.error || ''));
      }
    } catch (e) { alert('錯誤: ' + e.message); }
  }

  async function saveTriggers() {
    const triggers = [
      document.getElementById('trigger1').checked && 'macd_golden',
      document.getElementById('trigger2').checked && 'ma_breakout',
      document.getElementById('trigger3').checked && 'rsi_oversold',
      document.getElementById('trigger4').checked && 'limit_move',
      document.getElementById('trigger5').checked && 'foreign_buy_3d',
    ].filter(Boolean);
    try {
      await fetch(API + '/api/line/triggers', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          triggers,
          push_time: document.getElementById('pushTime').value
        })
      });
      alert('已儲存');
    } catch (e) { alert('儲存失敗: ' + e.message); }
  }

  async function loadLog() {
    try {
      const r = await fetch(API + '/api/line/log');
      const j = await r.json();
      const logs = j.logs || j.items || [];
      document.getElementById('logCount').textContent = logs.length + ' 筆';
      if (!logs.length) {
        document.getElementById('logList').innerHTML = '<div class="empty-text">尚無推播紀錄</div>';
        return;
      }
      document.getElementById('logList').innerHTML = logs.slice(0, 20).map(l => {
        const time = new Date(l.sent_at || l.timestamp).toLocaleString('zh-TW', { hour12: false });
        const status = l.status === 'success' ? 'success' : 'failed';
        return `<div class="log-row">
          <div class="time">${time}</div>
          <div class="target">${esc(l.target_name || l.target_id || '')}</div>
          <div style="flex:1;padding-left:14px">${esc((l.message || '').slice(0, 50))}${(l.message || '').length > 50 ? '…' : ''}</div>
          <div class="status ${status}">${l.status || '—'}</div>
        </div>`;
      }).join('');
    } catch (e) {
      document.getElementById('logList').innerHTML = '<div class="empty-text">載入失敗: ' + esc(e.message) + '</div>';
    }
  }

  // Initial load
  refreshRecipients();
  loadLog();
  document.getElementById('botInfo').textContent = 'LINE Bot 已連線 · ' + new Date().toLocaleString('zh-TW');
  </script>
</body>
</html>
