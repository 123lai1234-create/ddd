<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="我的小茶坊 封面">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#bfe3c0"/>
      <stop offset="60%" stop-color="#e8f3d8"/>
      <stop offset="100%" stop-color="#f6efdc"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fb069"/>
      <stop offset="100%" stop-color="#4c7a45"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5d9151"/>
      <stop offset="100%" stop-color="#38652f"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffdf4"/>
      <stop offset="100%" stop-color="#e9dcc0"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#sky)"/>
  <circle cx="660" cy="80" r="46" fill="#f7d774"/>
  <circle cx="660" cy="80" r="60" fill="#f7d774" opacity="0.25"/>
  <ellipse cx="120" cy="70" rx="70" ry="22" fill="#ffffff" opacity="0.8"/>
  <ellipse cx="300" cy="48" rx="52" ry="16" fill="#ffffff" opacity="0.7"/>
  <path d="M0 210 Q 200 150 400 200 T 800 190 V 450 H 0 Z" fill="url(#hill)"/>
  <path d="M0 280 Q 220 220 430 270 T 800 260 V 450 H 0 Z" fill="url(#hill2)"/>
  <!-- 茶叢 -->
  <g fill="#2f5d3a">
    <ellipse cx="120" cy="300" rx="72" ry="30"/>
    <ellipse cx="290" cy="330" rx="80" ry="32"/>
    <ellipse cx="480" cy="305" rx="76" ry="30"/>
    <ellipse cx="650" cy="335" rx="82" ry="32"/>
  </g>
  <g fill="#7fb069">
    <ellipse cx="120" cy="292" rx="60" ry="20"/>
    <ellipse cx="290" cy="322" rx="66" ry="20"/>
    <ellipse cx="480" cy="297" rx="62" ry="20"/>
    <ellipse cx="650" cy="327" rx="68" ry="20"/>
  </g>
  <!-- 茶芽 -->
  <g stroke="#d9e8b0" stroke-width="4" stroke-linecap="round">
    <line x1="120" y1="288" x2="112" y2="268"/>
    <line x1="120" y1="288" x2="128" y2="266"/>
    <line x1="290" y1="318" x2="282" y2="298"/>
    <line x1="290" y1="318" x2="298" y2="296"/>
    <line x1="480" y1="293" x2="472" y2="273"/>
    <line x1="480" y1="293" x2="488" y2="271"/>
    <line x1="650" y1="323" x2="642" y2="303"/>
    <line x1="650" y1="323" x2="658" y2="301"/>
  </g>
  <!-- 茶杯 -->
  <g transform="translate(560 330)">
    <path d="M0 0 h110 v38 q0 34 -30 40 h-50 q-30 -6 -30 -40 Z" fill="url(#cup)" stroke="#8a6d3b" stroke-width="3"/>
    <path d="M110 10 q34 4 26 28 q-6 20 -28 16" fill="none" stroke="#8a6d3b" stroke-width="3"/>
    <path d="M25 -14 q8 -12 0 -22 M55 -14 q8 -12 0 -22 M85 -14 q8 -12 0 -22" fill="none" stroke="#b7a06a" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="55" cy="86" rx="62" ry="8" fill="#d9c9a3" stroke="#8a6d3b" stroke-width="2"/>
  </g>
  <!-- 標題 -->
  <rect x="36" y="36" width="330" height="118" rx="16" fill="#2f5d3a" opacity="0.92"/>
  <text x="60" y="92" font-family="sans-serif" font-size="52" font-weight="bold" fill="#f6efdc">我的小茶坊</text>
  <text x="60" y="130" font-family="sans-serif" font-size="20" fill="#cfe3b8">採茶・製茶・經營小遊戲</text>
  <g font-family="sans-serif" font-size="16" fill="#f6efdc">
    <text x="60" y="176" opacity="0.85">🌿 手採茶芽　🍵 五維製茶　🎲 抽籤集設備</text>
  </g>
