<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>仙俠傳 · 回合制 RPG</title>
<meta name="description" content="仙俠傳 — 經典回合制 RPG，仙劍奇俠傳風格，純瀏覽器遊玩。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%;
  background: #000;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  overflow: hidden;
  font-family: 'Noto Serif TC', 'Source Han Serif TC', 'SimSun', serif;
}
#game-wrap {
  position: relative;
  width: 800px; height: 600px;
  max-width: 100vw;
}
#game-canvas {
  display: block;
  width: 100%; height: 100%;
  image-rendering: pixelated;
  cursor: default;
}
#ui-overlay {
  position: absolute; inset: 0;
  pointer-events: none;
}
#hint {
  position: fixed; bottom: 12px;
  left: 50%; transform: translateX(-50%);
  color: #6b5a3a; font-size: 12px;
  letter-spacing: 0.05em;
  pointer-events: none;
  font-family: 'Noto Serif TC', serif;
}
</style>
</head>
<body>
<div id="game-wrap">
  <canvas id="game-canvas" width="800" height="600"></canvas>
  <div id="ui-overlay"></div>
</div>
<div id="hint">方向鍵移動 · Z/Enter 確認 · X/Esc 取消/選單</div>
<script src="/games/xian/game.js"></script>
<script src="/games/xian/engine.js"></script>
<script src="/games/xian/battle.js"></script>
<script src="/games/xian/world.js"></script>
<script src="/games/xian/dialogue.js"></script>
<script src="/games/xian/menu.js"></script>
<script src="/games/xian/main.js"></script>
</body>
</html>
