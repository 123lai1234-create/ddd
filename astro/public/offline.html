<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f0f23">
  <title>離線 - 不說</title>
  <style>
    :root { --bg: #0f0f23; --bg2: #1a1a3e; --txt: #e0e0ff; --txt2: #8888aa; --blue: #448aff; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
      background: var(--bg);
      color: var(--txt);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 480px;
      background: var(--bg2);
      border: 1px solid #2a2a5a;
      border-radius: 12px;
      padding: 32px;
      text-align: center;
    }
    .icon { font-size: 56px; margin-bottom: 16px; opacity: 0.7; }
    h1 { font-size: 20px; margin-bottom: 8px; color: var(--txt); }
    p { font-size: 13px; color: var(--txt2); line-height: 1.6; margin-bottom: 20px; }
    a.btn {
      display: inline-block;
      background: var(--blue);
      color: #fff;
      padding: 10px 20px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }
    a.btn:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>目前離線中</h1>
    <p>無法連線到伺服器。這頁可能在你的瀏覽器快取中還沒被開過，或是網路暫時不通。</p>
    <a class="btn" href="/">回首頁</a>
  </div>
</body>
</html>
