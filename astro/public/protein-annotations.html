<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Protein Studio</title><style>
*{box-sizing:border-box}body{margin:0;padding:16px;background:#f8fafc;color:#15253b;font:15px system-ui,sans-serif}header,section,aside{background:white;border:1px solid #dbe4ee;border-radius:12px;padding:16px}h1,h2{margin:0 0 12px}h1{font-size:22px}h2{font-size:17px}form,.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}button,input,select{font:inherit;padding:8px;border:1px solid #cbd5e1;border-radius:6px}button{cursor:pointer;background:#173d66;color:white}a{color:#184e86}main{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px;margin:12px 0}#annotation-viewer{height:420px;position:relative}#sequence{display:flex;flex-wrap:wrap;gap:4px;margin-top:12px}#sequence button{font:13px monospace;background:#e2e8f0;color:#15253b;padding:5px;min-width:32px}#sequence button[aria-pressed=true]{background:#facc15}#sequence small{display:block;font-size:9px}#sequence button.helix{border-bottom:4px solid #0d9488}#sequence button.sheet{border-bottom:4px solid #a855f7}#sequence button.missing{opacity:.5}#annotation-status{min-height:1.4em}#details{overflow-wrap:anywhere} @media(max-width:720px){main{grid-template-columns:1fr}#annotation-viewer{height:340px}}
</style><script defer src="https://3Dmol.org/build/3Dmol-min.js"></script><script defer src="/scripts/protein-annotations.js"></script></head><body>
<header><h1>Protein Studio · 蛋白質結構分析</h1><form><label for="annotation-pdb">PDB ID</label><select id="annotation-pdb" name="pdb">
  <optgroup label="血紅蛋白與肌紅蛋白">
    <option value="4HHB">4HHB · 血紅蛋白</option>
    <option value="1HHO">1HHO · 氧合血紅蛋白</option>
    <option value="1A3N">1A3N · 去氧血紅蛋白</option>
    <option value="1MBN">1MBN · 肌紅蛋白</option>
    <option value="1MBO">1MBO · 氧合肌紅蛋白</option>
  </optgroup>
  <optgroup label="酵素與複合體">
    <option value="1LYZ">1LYZ · 溶菌酶</option>
    <option value="1TIM">1TIM · 磷酸丙糖異構酶</option>
    <option value="1CA2">1CA2 · 碳酸酐酶 II</option>
    <option value="1AKE">1AKE · 腺苷酸激酶</option>
    <option value="1M17">1M17 · EGFR 激酶結構域</option>
    <option value="1BRS">1BRS · Barnase 與 Barstar 複合體</option>
    <option value="2CI2">2CI2 · 絲胺酸蛋白酶抑制劑 CI-2</option>
    <option value="4HHC">4HHC · VP4 蛋白酶</option>
  </optgroup>
  <optgroup label="其他蛋白質與 DNA 複合體">
    <option value="1UBQ">1UBQ · 泛素</option>
    <option value="1CRN">1CRN · Crambin</option>
    <option value="1CBN">1CBN · Crambin 高解析結構</option>
    <option value="1GFL">1GFL · 綠色螢光蛋白</option>
    <option value="1EMA">1EMA · 綠色螢光蛋白</option>
    <option value="4INS">4INS · 豬胰島素</option>
    <option value="1IGT">1IGT · 免疫球蛋白</option>
    <option value="1STP">1STP · 鏈黴親和素與生物素</option>
    <option value="1BEB">1BEB · 牛 β-乳球蛋白</option>
    <option value="1CAG">1CAG · 類膠原蛋白胜肽</option>
    <option value="1TUP">1TUP · p53 與 DNA</option>
    <option value="1D66">1D66 · GAL4 與 DNA</option>
  </optgroup>
</select><button>載入結構</button><a id="annotation-source" target="_blank" rel="noopener">RCSB 原始資料</a><a href="https://www.rcsb.org/" target="_blank" rel="noopener">搜尋其他 RCSB 結構</a></form><p id="annotation-status" role="status"></p></header>
<main><section><h2>3D 結構</h2><div class="toolbar"><label>顯示方式 <select id="style"><option value="cartoon">Cartoon</option><option value="stick">Stick</option><option value="sphere">Sphere</option></select></label><button id="reset" type="button">重設視角</button></div><div id="annotation-viewer"></div></section><aside><h2>結構資訊</h2><div id="details"></div><p id="selected" aria-live="polite">選取序列或模型中的殘基</p><p><a id="download">下載 PDB</a> · <a id="fasta">FASTA</a></p></aside></main>
<section><h2>序列與二級結構</h2><label>蛋白質鏈 <select id="chain"></select></label><p>綠色：α-Helix · 紫色：β-Sheet · 淡色：未解析殘基（若可判定）</p><div id="sequence"></div></section></body></html>
