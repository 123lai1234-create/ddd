<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock-App 總覽儀表板</title>
  <link rel="icon" type="image/svg+xml" href="static/favicon.svg">
  <style>
    :root{--bg:#0f0f23;--bg2:#1a1a3e;--bg3:#1e1e42;--txt:#e0e0ff;--txt2:#8888aa;
          --green:#00c853;--red:#ff1744;--orange:#ff9100;--purple:#d500f9;
          --blue:#448aff;--cyan:#00bcd4;--bdr:#2a2a5a;--yellow:#ffd600}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI','Microsoft JhengHei',sans-serif;background:var(--bg);color:var(--txt);padding:0;min-height:100vh}
    .header{background:linear-gradient(135deg,var(--bg2),#12122e);padding:14px 24px;
      display:flex;align-items:center;justify-content:space-between;
      border-bottom:1px solid var(--bdr);position:sticky;top:0;z-index:100}
    .header h1{font-size:20px;background:linear-gradient(90deg,var(--blue),var(--purple));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:700}
    .header .sub{font-size:12px;color:var(--txt2);margin-top:2px}
    .nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
    .nav a{background:transparent;border:1px solid var(--bdr);color:var(--txt);
      padding:5px 11px;border-radius:6px;text-decoration:none;font-size:12px;transition:all .2s}
    .nav a:hover{background:var(--blue);border-color:var(--blue)}
    .container{max-width:1200px;margin:0 auto;padding:20px}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:18px;margin-bottom:18px}
    .card{background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;padding:18px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
    .card h2{font-size:15px;color:var(--cyan);margin-bottom:12px;display:flex;align-items:center;gap:8px}
    .card h2 .badge{background:var(--bg3);color:var(--txt2);font-size:10px;padding:2px 8px;border-radius:8px;font-weight:400}
    .row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--bg3);font-size:13px}
    .row:last-child{border-bottom:none}
    .label{color:var(--txt2);font-size:12px}
    .val{font-weight:700;font-family:monospace}
    .up{color:var(--red)}
    .down{color:var(--green)}
    .neutral{color:var(--txt)}
    .big-num{font-size:28px;font-weight:700;font-family:monospace}
    .stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
    .stat{background:var(--bg3);padding:8px;border-radius:6px;text-align:center}
    .stat .lbl{font-size:10px;color:var(--txt2);margin-bottom:2px}
    .stat .num{font-size:18px;font-weight:700;font-family:monospace}
    .ind-bar{display:flex;align-items:center;gap:8px;padding:5px 0}
    .ind-bar .nm{width:90px;font-size:12px;color:var(--txt2)}
    .ind-bar .bar{flex:1;height:8px;background:var(--bg3);border-radius:4px;overflow:hidden;position:relative}
    .ind-bar .fill{height:100%;border-radius:4px;transition:width .4s}
    .ind-bar .pct{width:60px;text-align:right;font-size:12px;font-family:monospace;font-weight:700}
    .loading-text{text-align:center;padding:20px;color:var(--txt2);font-size:13px}
    .error-text{text-align:center;padding:12px;color:var(--red);font-size:12px}
    .footer{text-align:center;padding:20px;color:var(--txt2);font-size:11px}
    .pill{display:inline-block;padding:2px 8px;border-radius:10px;font-size:10px;background:var(--bg3);margin-right:4px}
    .pill.up{background:rgba(255,23,68,.2);color:var(--red)}
    .pill.down{background:rgba(0,200,83,.2);color:var(--green)}
    @media (max-width:600px){
      .container{padding:10px}
      .stats-grid{grid-template-columns:repeat(2,1fr)}
      .grid{grid-template-columns:1fr}
      .header h1{font-size:16px}
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>📊 Stock-App 總覽儀表板</h1>
      <div class="sub" id="asOfBar">載入中…</div>
    </div>
    <div class="nav">
      <a href="/stock/heatmap.html">🔥 熱力圖</a>
      <a href="/stock/ranking.html">📊 排名</a>
      <a href="/stock/ai-warroom.html">🤖 AI 戰室</a>
      <a href="/stock/btc.html">₿ BTC</a>
      <a href="/stock/futures.html">📉 台指期</a>
      <a href="/stock/buyback.html">💰 庫藏股</a>
      <a href="/stock/line-push.html">💬 LINE</a>
      <a href="/stock/index.html">📈 個股</a>
      <a href="/stock/sitemap.html">🗂 全站</a>
    </div>
  </div>
  <div class="container">
    <div class="grid">
      <!-- 大盤狀態 -->
      <div class="card">
        <h2>🌐 國際指數 <span class="badge" id="overseasTs">—</span></h2>
        <div id="overseasContent" class="loading-text">載入中…</div>
      </div>

      <!-- 漲跌分布 -->
      <div class="card">
        <h2>📊 60 檔自選股漲跌 <span class="badge" id="distTs">—</span></h2>
        <div class="stats-grid">
          <div class="stat"><div class="lbl">上漲</div><div class="num up" id="upCount">—</div></div>
          <div class="stat"><div class="lbl">下跌</div><div class="num down" id="downCount">—</div></div>
          <div class="stat"><div class="lbl">平盤</div><div class="num" id="flatCount">—</div></div>
          <div class="stat"><div class="lbl">總計</div><div class="num" id="totalCount">—</div></div>
        </div>
        <div id="topMovers"></div>
      </div>

      <!-- 產業排行 -->
      <div class="card">
        <h2>🏭 產業 5 日漲跌排行 <span class="badge">市值加權</span></h2>
        <div id="indContent" class="loading-text">載入中…</div>
      </div>

      <!-- macro 摘要 -->
      <div class="card">
        <h2>💱 總經指標 <span class="badge" id="macroTs">—</span></h2>
        <div id="macroContent" class="loading-text">載入中…</div>
      </div>

      <!-- 今日訊號 -->
      <div class="card">
        <h2>📍 今日觸發訊號 <span class="badge" id="markersCount">—</span></h2>
        <div id="markersContent" class="loading-text">載入中…</div>
      </div>

      <!-- 法人買賣超 -->
      <div class="card">
        <h2>🏦 三大法人 30 日累積買超 Top 10</h2>
        <div id="instContent" class="loading-text">載入中…</div>
      </div>
    </div>
    <div class="footer">
      ⏱ 載入時間 <span id="loadTime">—</span> ms · 自動每 60 秒刷新
    </div>
  </div>
  <script>
  const API = '';
  function fmt(n, d) { if (n == null || isNaN(n)) return '-'; return Number(n).toFixed(d ?? 2); }
  function pct(v) { if (v == null) return '-'; var s = v >= 0 ? '+' : ''; return s + Number(v).toFixed(2) + '%'; }
  function cls(v) { return v > 0 ? 'up' : v < 0 ? 'down' : 'neutral'; }
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  async function loadOverseas() {
    try {
      const r = await fetch(API + '/api/overseas').catch(() => null);
      // /api/overseas is 404, fallback to macro_data
      const r2 = await fetch(API + '/api/macro_data');
      const j = await r2.json();
      const data = (j.data || []).slice(0, 10);
      if (!data.length) { document.getElementById('overseasContent').innerHTML = '<div class="error-text">無資料</div>'; return; }
      const html = data.map(d => {
        const v = Number(d.最新值 ?? d.value ?? d.close ?? 0);
        const p = Number(d.前值 ?? d.prev ?? 0);
        const chg = p ? ((v - p) / p * 100) : 0;
        return '<div class="row"><span class="label">' + esc(d.指標 || d.name) + '</span><span class="val ' + cls(chg) + '">' + fmt(v, 2) + ' (' + pct(chg) + ')</span></div>';
      }).join('');
      document.getElementById('overseasContent').innerHTML = html;
      document.getElementById('overseasTs').textContent = j.as_of || '—';
    } catch (e) { document.getElementById('overseasContent').innerHTML = '<div class="error-text">載入失敗: ' + e.message + '</div>'; }
  }

  async function loadHeatmap() {
    try {
      const r = await fetch(API + '/api/heatmap');
      const j = await r.json();
      const stocks = j.stocks || [];
      let up = 0, down = 0, flat = 0;
      const movers = [];
      for (const s of stocks) {
        // 2026-08-10: heatmap source 欄位可能叫 change_pct 或 chg_1d，兩種都吃
        const c = Number(s.change_pct ?? s.chg_1d ?? 0);
        if (c > 0.1) up++;
        else if (c < -0.1) down++;
        else flat++;
        movers.push({ code: s.code, name: s.name, chg: c });
      }
      movers.sort((a, b) => Math.abs(b.chg) - Math.abs(a.chg));
      document.getElementById('upCount').textContent = up;
      document.getElementById('downCount').textContent = down;
      document.getElementById('flatCount').textContent = flat;
      document.getElementById('totalCount').textContent = stocks.length;
      document.getElementById('distTs').textContent = j.as_of || '—';
      const top = movers.slice(0, 5);
      const bot = movers.slice(-5).reverse();
      let html = '<div style="font-size:11px;color:var(--txt2);margin:8px 0 4px">📈 漲幅 Top 5</div>';
      for (const m of top) html += '<div class="row"><span class="label">' + esc(m.name) + ' (' + esc(m.code) + ')</span><span class="val up">' + pct(m.chg) + '</span></div>';
      html += '<div style="font-size:11px;color:var(--txt2);margin:8px 0 4px">📉 跌幅 Top 5</div>';
      for (const m of bot) html += '<div class="row"><span class="label">' + esc(m.name) + ' (' + esc(m.code) + ')</span><span class="val down">' + pct(m.chg) + '</span></div>';
      document.getElementById('topMovers').innerHTML = html;
      // industries
      const inds = (j.industries || []).slice(0, 10);
      const maxAbs = Math.max(...inds.map(i => Math.abs(i.chg_5d || 0)), 1);
      let ih = '';
      for (const i of inds) {
        const w = Math.min(100, Math.abs(i.chg_5d || 0) / maxAbs * 100);
        const color = (i.chg_5d || 0) >= 0 ? 'var(--red)' : 'var(--green)';
        ih += '<div class="ind-bar"><div class="nm">' + esc(i.label) + '</div><div class="bar"><div class="fill" style="width:' + w + '%;background:' + color + '"></div></div><div class="pct ' + cls(i.chg_5d) + '">' + pct(i.chg_5d) + '</div></div>';
      }
      document.getElementById('indContent').innerHTML = ih || '<div class="error-text">無產業資料</div>';
    } catch (e) { document.getElementById('topMovers').innerHTML = '<div class="error-text">' + e.message + '</div>'; }
  }

  async function loadMarkers() {
    try {
      const r = await fetch(API + '/api/markers/history?days=1');
      const j = await r.json();
      const rows = (j.rows || j.history || j.items || []).slice(0, 12);
      if (!rows.length) { document.getElementById('markersContent').innerHTML = '<div class="error-text">今日無訊號</div>'; return; }
      const typeMap = { buy_chase: '進場', sell_stop: '退場', limit_up: '漲停', foreign_buy_3d: '外資連買' };
      let html = '';
      for (const m of rows) {
        const t = typeMap[m.type] || m.type;
        const c = (m.type === 'sell_stop') ? 'down' : 'up';

        // ★ 修正 BUG-2：後端 markers.text 可能是「JSON 字串」或「物件」，
        //   直接 slice/toString 會把 {"close":null,"ma5":null...} 整段塞到畫面。
        //   改為：嘗試 JSON.parse，失敗則當純文字；有指標摘要就用人話顯示。
        let text = m.text;
        if (typeof text === 'string') {
          const trimmed = text.trim();
          if (trimmed.startsWith('{') || trimmed.startsWith('[')) {
            try {
              const obj = JSON.parse(trimmed);
              // 優先顯示「自訂訊息」欄位，其次抽出關鍵指標摘要
              text = obj.message || obj.msg || obj.note || obj.summary
                || summarizeMarkerPayload(obj);
            } catch (_) {
              // 不是合法 JSON，原樣保留前 40 字
              text = trimmed.slice(0, 40);
            }
          }
        } else if (text && typeof text === 'object') {
          text = text.message || text.msg || text.note || text.summary || summarizeMarkerPayload(text);
        }
        if (text == null) text = '';

        const code = m.code || (typeof m.text === 'object' ? (m.text.code || '') : '');
        html += '<div class="row"><span class="label"><span class="pill ' + c + '">' + esc(t) + '</span>' + esc(code) + '</span><span class="val neutral">' + esc(String(text).slice(0, 60)) + '</span></div>';
      }
      document.getElementById('markersContent').innerHTML = html;
      document.getElementById('markersCount').textContent = rows.length + ' 個';
    } catch (e) { document.getElementById('markersContent').innerHTML = '<div class="error-text">' + e.message + '</div>'; }
  }

  // ★ 從 marker 物件抽幾個關鍵欄位組成一行可讀摘要
  function summarizeMarkerPayload(obj) {
    if (!obj || typeof obj !== 'object') return '';
    const parts = [];
    if (obj.signal) parts.push(String(obj.signal));
    if (obj.action) parts.push(String(obj.action));
    if (obj.price != null) parts.push(`價 ${obj.price}`);
    if (obj.ma5 != null) parts.push(`MA5 ${obj.ma5}`);
    if (obj.ma20 != null) parts.push(`MA20 ${obj.ma20}`);
    if (obj.volume != null) parts.push(`量 ${obj.volume}`);
    if (obj.note) parts.push(String(obj.note));
    return parts.join(' · ');
  }

  async function loadInstitutional() {
    try {
      const r = await fetch(API + '/api/warming_zone_scan');
      const j = await r.json();
      const items = (j.items || j.results || []).slice(0, 10);
      if (!items.length) { document.getElementById('instContent').innerHTML = '<div class="error-text">無資料</div>'; return; }
      let html = '';
      for (const it of items) {
        const v = Number(it.dist_high_60d_pct || it.score || 0);
        html += '<div class="row"><span class="label">' + esc(it.code || '') + ' ' + esc(it.name || '') + '</span><span class="val neutral">' + fmt(v, 1) + ' 分</span></div>';
      }
      document.getElementById('instContent').innerHTML = html;
    } catch (e) { document.getElementById('instContent').innerHTML = '<div class="error-text">' + e.message + '</div>'; }
  }

  async function refresh() {
    const t0 = Date.now();
    document.getElementById('asOfBar').textContent = '更新中…';
    await Promise.all([loadOverseas(), loadHeatmap(), loadMarkers(), loadInstitutional()]);
    document.getElementById('asOfBar').textContent = '最後更新 ' + new Date().toLocaleTimeString('zh-TW');
    document.getElementById('loadTime').textContent = (Date.now() - t0);
  }
  refresh();
  setInterval(refresh, 60_000);
  </script>
</body>
</html>
