<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>漲跌排名｜台股均線實戰系統</title>
  <link rel="icon" type="image/svg+xml" href="/stock/favicon.svg">
  <style>
    :root{--bg:#0f0f23;--bg2:#1a1a3e;--bg3:#1e1e42;--txt:#e0e0ff;--txt2:#8888aa;
          --green:#00c853;--red:#ff1744;--orange:#ff9100;--purple:#d500f9;
          --blue:#448aff;--cyan:#00bcd4;--bdr:#2a2a5a;--yellow:#ffd600}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Segoe UI','Microsoft JhengHei',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
    .header{background:linear-gradient(135deg,var(--bg2),#12122e);padding:14px 24px;
      display:flex;align-items:center;justify-content:space-between;
      border-bottom:1px solid var(--bdr);position:sticky;top:0;z-index:100}
    .header h1{font-size:20px;background:linear-gradient(90deg,var(--red),var(--green));
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:700}
    .header .sub{font-size:12px;color:var(--txt2);margin-top:2px}
    .nav{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
    .nav a{background:transparent;border:1px solid var(--bdr);color:var(--txt);
      padding:5px 11px;border-radius:6px;text-decoration:none;font-size:12px;transition:all .2s}
    .nav a:hover{background:var(--cyan);border-color:var(--cyan)}
    .container{max-width:1200px;margin:0 auto;padding:20px}
    .layout{display:grid;grid-template-columns:1fr 1fr;gap:18px}
    @media(max-width:900px){.layout{grid-template-columns:1fr}}
    .card{background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;padding:18px}
    .card h2{font-size:15px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
    .up-h{color:var(--red)}
    .down-h{color:var(--green)}
    .badge{background:var(--bg3);color:var(--txt2);font-size:10px;padding:2px 8px;border-radius:8px;font-weight:400}
    .rank-row{display:flex;justify-content:space-between;align-items:center;
      padding:10px 12px;border-radius:6px;margin-bottom:6px;background:var(--bg3);
      transition:transform .15s;cursor:pointer}
    .rank-row:hover{transform:translateX(4px);background:var(--bg2)}
    .rank-rank{width:30px;font-size:14px;font-weight:700;font-family:monospace;color:var(--txt2)}
    .rank-info{flex:1}
    .rank-name{font-size:14px;font-weight:600;color:var(--txt)}
    .rank-code{font-size:11px;color:var(--txt2);font-family:monospace}
    .rank-pct{font-size:16px;font-weight:700;font-family:monospace;min-width:80px;text-align:right}
    .rank-pct.up{color:var(--red)}
    .rank-pct.down{color:var(--green)}
    .filters{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
    .filter-btn{background:var(--bg3);border:1px solid var(--bdr);color:var(--txt);
      padding:6px 14px;border-radius:6px;cursor:pointer;font-size:12px;transition:all .15s}
    .filter-btn.active{background:var(--cyan);color:#000;border-color:var(--cyan);font-weight:600}
    .filter-btn:hover:not(.active){background:var(--bg2)}
    .stats-bar{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px}
    .stat-chip{background:var(--bg3);padding:8px 14px;border-radius:6px;font-size:12px}
    .stat-chip .lbl{color:var(--txt2);margin-right:6px}
    .stat-chip .val{font-weight:700;color:var(--cyan);font-family:monospace}
    .loading-text{text-align:center;padding:30px;color:var(--txt2);font-size:13px}
    .footer{text-align:center;padding:20px;color:var(--txt2);font-size:11px}
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>📊 漲跌市值勢力圖 / 升降階排名</h1>
      <div class="sub" id="asOfBar">依市值加權的板塊強度與個股排名</div>
    </div>
    <div class="nav">
      <a href="/stock/dashboard.html">📊 儀表板</a>
      <a href="/stock/heatmap.html">🔥 熱力圖</a>
      <a href="/stock/ai-warroom.html">🤖 AI 戰室</a>
      <a href="/stock/futures.html">📉 台指期</a>
      <a href="/stock/sitemap.html">🗂 全站</a>
    </div>
  </div>
  <div class="container">
    <div class="stats-bar">
      <div class="stat-chip"><span class="lbl">📈 上漲家數</span><span class="val up" id="statUp">—</span></div>
      <div class="stat-chip"><span class="lbl">📉 下跌家數</span><span class="val down" id="statDown">—</span></div>
      <div class="stat-chip"><span class="lbl">➖ 平盤</span><span class="val" id="statFlat">—</span></div>
      <div class="stat-chip"><span class="lbl">🚫 跌停</span><span class="val down" id="statLimitDown">—</span></div>
      <div class="stat-chip"><span class="lbl">🚀 漲停</span><span class="val up" id="statLimitUp">—</span></div>
      <div class="stat-chip"><span class="lbl">💵 總成交額</span><span class="val" id="statTurnover">—</span></div>
    </div>

    <div class="filters">
      <button class="filter-btn active" data-scope="all">全部</button>
      <button class="filter-btn" data-scope="weighted">加權指數</button>
      <button class="filter-btn" data-scope="otc">櫃買</button>
      <button class="filter-btn" data-scope="midcap">中型100</button>
      <button class="filter-btn" data-scope="smallcap">櫃買小型</button>
    </div>

    <div class="layout">
      <div class="card">
        <h2 class="up-h">🚀 漲幅排行 <span class="badge" id="upCount">—</span></h2>
        <div id="upList" class="loading-text">載入中…</div>
      </div>
      <div class="card">
        <h2 class="down-h">📉 跌幅排行 <span class="badge" id="downCount">—</span></h2>
        <div id="downList" class="loading-text">載入中…</div>
      </div>
      <div class="card">
        <h2>🔥 成交值排行 <span class="badge" id="volCount">—</span></h2>
        <div id="volList" class="loading-text">載入中…</div>
      </div>
      <div class="card">
        <h2>🚀 漲停股票 <span class="badge" id="luCount">—</span></h2>
        <div id="luList" class="loading-text">載入中…</div>
      </div>
      <div class="card" style="grid-column: span 2">
        <h2>🚫 跌停股票 <span class="badge" id="ldCount">—</span></h2>
        <div id="ldList" class="loading-text">載入中…</div>
      </div>
    </div>
    <div class="footer">資料來源：TWSE + TPEX 即時行情 · 每 60 秒更新</div>
  </div>
  <script>
  const API = '';
  let currentScope = 'all';
  function fmt(n, d) { if (n == null || isNaN(n)) return '-'; return Number(n).toFixed(d ?? 2); }
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function pct(v) { if (v == null) return '-'; return (v >= 0 ? '+' : '') + Number(v).toFixed(2) + '%'; }
  function open(code) { window.open('/stock/index.html?code=' + encodeURIComponent(code), '_blank'); }

  function renderRankRow(rank, s, key) {
    const v = Number(s[key] || 0);
    const cls = v > 0 ? 'up' : v < 0 ? 'down' : '';
    return `
      <div class="rank-row" onclick="open('${esc(s.code)}')">
        <div class="rank-rank">#${rank}</div>
        <div class="rank-info">
          <div class="rank-name">${esc(s.name || s.code)}</div>
          <div class="rank-code">${esc(s.code)} · ${esc(s.industry || '')}</div>
        </div>
        <div class="rank-pct ${cls}">${pct(v)}</div>
      </div>`;
  }

  async function loadRanking() {
    try {
      const url = `${API}/api/ranking?scope=${currentScope}&limit=15`;
      const r = await fetch(url);
      const j = await r.json();

      const ups = (j.up || []).slice(0, 15);
      const downs = (j.down || []).slice(0, 15);
      const vols = (j.volume || []).slice(0, 15);
      const limitUp = (j.limit_up || []).slice(0, 15);
      const limitDown = (j.limit_down || []).slice(0, 15);

      document.getElementById('upList').innerHTML = ups.length
        ? ups.map((s, i) => renderRankRow(i + 1, s, 'change_pct')).join('')
        : '<div class="loading-text">無資料</div>';
      document.getElementById('downList').innerHTML = downs.length
        ? downs.map((s, i) => renderRankRow(i + 1, s, 'change_pct')).join('')
        : '<div class="loading-text">無資料</div>';
      document.getElementById('volList').innerHTML = vols.length
        ? vols.map((s, i) => {
          const v = Number(s.turnover || s.volume || 0);
          const display = v > 1e8 ? (v/1e8).toFixed(2) + '億' : (v/1e6).toFixed(0) + 'M';
          return `<div class="rank-row" onclick="open('${esc(s.code)}')">
            <div class="rank-rank">#${i + 1}</div>
            <div class="rank-info">
              <div class="rank-name">${esc(s.name || s.code)}</div>
              <div class="rank-code">${esc(s.code)} · ${esc(s.industry || '')}</div>
            </div>
            <div class="rank-pct" style="color:var(--cyan)">${display}</div>
          </div>`;
        }).join('')
        : '<div class="loading-text">無資料</div>';

      document.getElementById('luList').innerHTML = limitUp.length
        ? limitUp.map((s, i) => renderRankRow(i + 1, s, 'change_pct')).join('')
        : '<div class="loading-text">無漲停股</div>';
      document.getElementById('ldList').innerHTML = limitDown.length
        ? limitDown.map((s, i) => renderRankRow(i + 1, s, 'change_pct')).join('')
        : '<div class="loading-text">無跌停股</div>';

      document.getElementById('upCount').textContent = ups.length;
      document.getElementById('downCount').textContent = downs.length;
      document.getElementById('volCount').textContent = vols.length;
      document.getElementById('luCount').textContent = limitUp.length;
      document.getElementById('ldCount').textContent = limitDown.length;

      // Stats
      document.getElementById('statUp').textContent = j.stats?.up_count || '—';
      document.getElementById('statDown').textContent = j.stats?.down_count || '—';
      document.getElementById('statFlat').textContent = j.stats?.flat_count || '—';
      document.getElementById('statLimitUp').textContent = limitUp.length;
      document.getElementById('statLimitDown').textContent = limitDown.length;
      const turn = Number(j.stats?.total_turnover || 0);
      document.getElementById('statTurnover').textContent = turn ? ((turn/1e12).toFixed(2) + '兆' || (turn/1e8).toFixed(0) + '億') : '—';
      document.getElementById('asOfBar').textContent = (j.as_of || '—') + ' · 即時排名';
    } catch (e) {
      ['upList', 'downList', 'volList', 'luList', 'ldList'].forEach(id => {
        document.getElementById(id).innerHTML = '<div class="loading-text">載入失敗: ' + esc(e.message) + '</div>';
      });
    }
  }

  document.querySelectorAll('.filter-btn').forEach(b => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      currentScope = b.dataset.scope;
      loadRanking();
    });
  });

  loadRanking();
  setInterval(loadRanking, 60000);
  </script>
</body>
</html>
