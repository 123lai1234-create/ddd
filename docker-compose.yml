# D:\project — 完整本地 Docker 開發環境
# 前端 (nginx) + API (FastAPI uvicorn)
#
# 啟動：docker compose up --build
# API 文件：http://localhost:8080/docs
# 前端：   http://localhost:80

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_URL_NEON: ${DATABASE_URL_NEON:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        # 瀏覽器從 localhost:8080 直接呼叫 API，不走 nginx 內网
        API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
