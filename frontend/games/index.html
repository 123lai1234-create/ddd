<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>遊戲中心 · Arcade</title>
<meta name="description" content="跨域作品集的互動遊戲中心：3D 貪食蛇、太空射擊、霓虹打磚塊，後端排行榜即時同步。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🕹</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100vh;background:radial-gradient(ellipse at 50% -20%,#1a0a40 0%,#04020c 60%);color:#e8eafc;font-family:'Inter',sans-serif;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background:linear-gradient(rgba(255,45,149,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,229,255,.05) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0;mask-image:radial-gradient(ellipse at center,#000 30%,transparent 80%)}
.hero{padding:80px 24px 40px;text-align:center;position:relative;z-index:1}
.hero h1{font-family:'Orbitron';font-weight:900;font-size:clamp(2rem,5vw,3.5rem);background:linear-gradient(135deg,#ff2d95,#00e5ff,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:2px;margin-bottom:12px;text-shadow:0 0 40px rgba(255,45,149,.3)}
.hero p{color:#8b92c0;font-size:1.1rem;max-width:620px;margin:0 auto}
.wrap{max-width:1200px;margin:0 auto;padding:20px 24px 80px;position:relative;z-index:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px}
.card{position:relative;padding:24px;border-radius:14px;background:linear-gradient(135deg,rgba(255,255,255,.04),rgba(255,255,255,.01));border:1px solid rgba(255,255,255,.08);overflow:hidden;transition:transform .3s,border-color .3s,box-shadow .3s;cursor:pointer;text-decoration:none;color:inherit;display:block}
.card::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(255,45,149,.15),transparent 40%);opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover{transform:translateY(-4px);border-color:rgba(255,45,149,.5);box-shadow:0 12px 40px rgba(255,45,149,.2),0 0 0 1px rgba(0,229,255,.2)}
.card:hover::before{opacity:1}
.emoji{font-size:3rem;margin-bottom:12px;filter:drop-shadow(0 0 18px currentColor)}
.title{font-family:'Orbitron';font-weight:700;font-size:1.35rem;margin-bottom:6px;letter-spacing:1px}
.desc{color:#8b92c0;font-size:.88rem;line-height:1.55;margin-bottom:14px}
.tag{display:inline-block;padding:3px 10px;border-radius:20px;background:rgba(0,229,255,.1);border:1px solid rgba(0,229,255,.3);color:#00e5ff;font-size:.68rem;letter-spacing:1px;text-transform:uppercase;font-weight:600;margin-right:6px}
.tag-wip{background:rgba(253,224,71,.08);border-color:rgba(253,224,71,.3);color:#fde047}
.back{position:absolute;top:24px;left:24px;color:#8b92c0;text-decoration:none;font-size:.85rem;padding:8px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.3);transition:all .2s;z-index:10}
.back:hover{color:#00e5ff;border-color:rgba(0,229,255,.4)}
.lb-block{margin-top:48px;padding:24px;border-radius:14px;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.06)}
.lb-block h2{font-family:'Orbitron';font-size:1.1rem;letter-spacing:1px;margin-bottom:12px;color:#00e5ff}
.lb-row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05);font-size:.88rem}
.lb-row:last-child{border:none}
.lb-rank{color:#fde047;font-family:'Orbitron';font-weight:700;width:40px}
.lb-player{flex:1;color:#e8eafc}
.lb-score{color:#22ffa7;font-family:monospace;font-weight:700}
.lb-empty{color:#8b92c0;font-size:.85rem;padding:12px 0;text-align:center}
</style>
</head>
<body>
<a href="/" class="back">← 回首頁</a>
<section class="hero">
<h1>ARCADE</h1>
<p>互動遊戲中心 · 3D 渲染 + 後端排行榜即時同步</p>
</section>
<div class="wrap">
<div class="grid" id="gameGrid"></div>
<div class="lb-block">
<h2>🏆 全站 Top 5</h2>
<div id="globalLB"></div>
</div>
</div>
<script>
const GAMES = [
  {id:'snake3d',title:'Neon Snake 3D',emoji:'🐍',color:'#22ffa7',desc:'三維立體貪食蛇，繞著發光方塊吃果實，避免撞到自己的身體。',tags:['3D','WebGL'],href:'/games/snake3d.html'},
  {id:'shooter3d',title:'Void Shooter',emoji:'🚀',color:'#00e5ff',desc:'第一人稱太空射擊，穿越隕石場擊落敵機，後端算關卡種子。',tags:['3D','WebGL'],href:'/games/shooter3d.html'},
  {id:'breakout',title:'Neon Breakout',emoji:'🎮',color:'#ff2d95',desc:'霓虹打磚塊：粒子爆炸、連擊特效、螢幕震動。',tags:['2D','Canvas'],href:'/games/breakout.html'},
  {id:'tetris3d',title:'Tetris Cube',emoji:'🧊',color:'#a855f7',desc:'3D 俄羅斯方塊，旋轉塔積木。',tags:['3D','WIP'],href:'#',wip:true},
];
const grid = document.getElementById('gameGrid');
GAMES.forEach(g => {
  const a = document.createElement('a');
  a.className = 'card';
  a.href = g.href;
  if (g.wip) { a.style.opacity = .5; a.addEventListener('click', e => { e.preventDefault(); alert('敬請期待 · 開發中'); }); }
  a.innerHTML = `
    <div class="emoji" style="color:${g.color}">${g.emoji}</div>
    <div class="title" style="color:${g.color}">${g.title}</div>
    <div class="desc">${g.desc}</div>
    <div>${g.tags.map(t => `<span class="tag ${t==='WIP'?'tag-wip':''}">${t}</span>`).join('')}</div>`;
  a.addEventListener('mousemove', e => {
    const r = a.getBoundingClientRect();
    a.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100) + '%');
    a.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100) + '%');
  });
  grid.appendChild(a);
});

async function loadGlobalLB() {
  const el = document.getElementById('globalLB');
  try {
    const results = await Promise.all(['snake3d','shooter3d','breakout'].map(g =>
      fetch('/api/games/leaderboard/' + g + '?limit=3').then(r => r.ok ? r.json() : {entries:[]}).catch(()=>({entries:[]}))
    ));
    const combined = [];
    results.forEach((r, i) => (r.entries || []).forEach(e => combined.push({...e, game: ['Snake3D','Shooter3D','Breakout'][i]})));
    combined.sort((a,b) => b.score - a.score);
    const top = combined.slice(0, 5);
    if (!top.length) { el.innerHTML = '<div class="lb-empty">還沒有紀錄 — 來當第一位吧！</div>'; return; }
    el.innerHTML = top.map((e, i) => `
      <div class="lb-row">
        <span class="lb-rank">#${i+1}</span>
        <span class="lb-player">${escapeHtml(e.player)} <span style="color:#8b92c0;font-size:.75rem">· ${e.game}</span></span>
        <span class="lb-score">${e.score.toLocaleString()}</span>
      </div>`).join('');
  } catch (err) {
    el.innerHTML = '<div class="lb-empty">排行榜暫時無法取得</div>';
  }
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
loadGlobalLB();
</script>
</body>
</html>
