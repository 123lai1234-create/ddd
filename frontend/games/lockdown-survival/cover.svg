<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f14"/>
      <stop offset="55%" stop-color="#111a16"/>
      <stop offset="100%" stop-color="#0a1410"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#9dff8a" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#9dff8a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#23303f" stroke-width="1" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>
  <rect width="800" height="450" fill="url(#glow)"/>

  <!-- 抽象樓層平面 -->
  <g opacity="0.85">
    <rect x="96" y="96"  width="130" height="30" rx="5" fill="#1d2836" stroke="#35465c"/>
    <rect x="250" y="96"  width="180" height="30" rx="5" fill="#1d2836" stroke="#35465c"/>
    <rect x="96" y="146" width="100" height="30" rx="5" fill="#1d2836" stroke="#35465c"/>
    <rect x="220" y="146" width="180" height="30" rx="5" fill="#16240f" stroke="#9dff8a"/>
    <rect x="96" y="196" width="330" height="30" rx="5" fill="#1d2836" stroke="#35465c"/>
    <rect x="96" y="246" width="150" height="30" rx="5" fill="#1d2836" stroke="#35465c"/>
    <rect x="270" y="246" width="150" height="30" rx="5" fill="#2a2010" stroke="#f2b544"/>
    <rect x="96" y="296" width="330" height="30" rx="5" fill="#1d2836" stroke="#35465c"/>
    <rect x="96" y="346" width="200" height="30" rx="5" fill="#1d2836" stroke="#35465c"/>
    <rect x="320" y="346" width="150" height="30" rx="5" fill="#1d2836" stroke="#35465c"/>
  </g>

  <!-- 玩家圓點 -->
  <g>
    <circle cx="300" cy="161" r="7" fill="#05080b" stroke="#9dff8a" stroke-width="2.5"/>
    <circle cx="345" cy="161" r="7" fill="#f2b544"/>
    <circle cx="182" cy="261" r="7" fill="#60a5fa"/>
    <circle cx="130" cy="116" r="6" fill="#f472b6"/>
  </g>

  <!-- 毒氣符號 -->
  <g opacity="0.9" fill="#9dff8a">
    <circle cx="470" cy="161" r="3"/><circle cx="482" cy="166" r="2.4"/>
    <circle cx="458" cy="169" r="2"/>
  </g>

  <!-- 標題 -->
  <g font-family="'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
    <text x="480" y="118" fill="#6b7a8c" font-size="15" letter-spacing="6" font-weight="700">LOCKDOWN</text>
    <text x="480" y="150" fill="#e8edf3" font-size="42" letter-spacing="8" font-weight="800">禁閉逃殺</text>
    <text x="480" y="186" fill="#9aa8b8" font-size="15" letter-spacing="2">封閉設施裡的六天</text>
    <text x="480" y="216" fill="#9dff8a" font-size="14" letter-spacing="1">基因 · 物資 · 毒氣 · 暗影</text>
  </g>
</svg>
