<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Void Shooter · Arcade</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#04020c;color:#e8eafc;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
#canvas{position:fixed;inset:0;display:block;cursor:crosshair}
.hud{position:fixed;top:16px;left:16px;z-index:5;font-family:'Courier New',monospace}
.pill{padding:6px 14px;background:rgba(0,0,0,.55);border:1px solid rgba(0,229,255,.4);border-radius:20px;font-size:.85rem;backdrop-filter:blur(8px);margin-right:8px;display:inline-block}
.pill.hp{border-color:rgba(255,45,149,.5);color:#ff2d95}
.back{position:fixed;top:16px;right:16px;z-index:5;color:#8b92c0;text-decoration:none;font-size:.85rem;padding:8px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.55);backdrop-filter:blur(8px)}
.back:hover{color:#00e5ff;border-color:rgba(0,229,255,.4)}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(4,2,12,.85);backdrop-filter:blur(8px);z-index:10}
.panel{padding:36px 48px;border-radius:16px;background:linear-gradient(135deg,rgba(0,229,255,.08),rgba(168,85,247,.08));border:1px solid rgba(255,255,255,.12);text-align:center;max-width:440px;width:90%}
.panel h1{font-size:2rem;margin-bottom:12px;background:linear-gradient(135deg,#00e5ff,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:2px}
.panel p{color:#a0a8c8;margin-bottom:18px;line-height:1.6;font-size:.9rem}
.panel input{width:100%;padding:10px 14px;background:rgba(0,0,0,.4);border:1px solid rgba(0,229,255,.3);border-radius:8px;color:inherit;font-size:.95rem;margin-bottom:14px;font-family:inherit}
.panel input:focus{outline:none;border-color:#00e5ff}
.btn{padding:11px 28px;background:linear-gradient(135deg,#00e5ff,#a855f7);color:#04020c;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:.95rem;letter-spacing:1px;margin:4px}
.btn-ghost{background:transparent;color:#e8eafc;border:1px solid rgba(255,255,255,.2)}
.lb{margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.08);text-align:left;font-size:.8rem}
.lb-title{color:#fde047;font-family:'Courier New',monospace;letter-spacing:2px;margin-bottom:6px}
.lb-entry{display:flex;justify-content:space-between;padding:3px 0;color:#a0a8c8;font-family:'Courier New',monospace}
.crosshair{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:36px;height:36px;border:2px solid rgba(0,229,255,.6);border-radius:50%;pointer-events:none;z-index:4}
.crosshair::before,.crosshair::after{content:'';position:absolute;background:#00e5ff}
.crosshair::before{left:50%;top:-6px;width:2px;height:12px;transform:translateX(-50%)}
.crosshair::after{top:50%;left:-6px;height:2px;width:12px;transform:translateY(-50%)}
.keys{font-size:.75rem;color:#8b92c0;margin-top:12px}
.keys span{display:inline-block;padding:2px 8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:4px;margin:2px;font-family:'Courier New',monospace}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="crosshair" id="crosshair" style="display:none"></div>
<a href="/games/" class="back">← 遊戲中心</a>
<div class="hud" id="hud" style="display:none">
<div><div class="pill">分數 <b id="score">0</b></div><div class="pill hp">HP <b id="hp">100</b></div><div class="pill">Wave <b id="wave">1</b></div></div>
<div style="margin-top:8px"><div class="pill" id="comboPill" style="display:none;border-color:rgba(253,224,71,.55);color:#fde047">Combo ×<b id="comboVal">1</b></div><div class="pill" id="pwPill" style="display:none">道具 <b id="pwVal"></b></div></div>
</div>

<div class="overlay" id="overlay">
<div class="panel">
<h1>VOID SHOOTER</h1>
<p>穿越霓虹星雲，擊落敵機。滑鼠瞄準、點擊射擊，WASD 平移機身。關卡種子由後端隨機產生。</p>
<input id="player" placeholder="玩家名稱" maxlength="24">
<button class="btn" onclick="startGame()">▶ 開始遊戲</button>
<div class="lb"><div class="lb-title">TOP 5</div><div id="lbList">載入中…</div></div>
<div class="keys"><span>W/A/S/D</span><span>滑鼠 瞄準</span><span>左鍵 射擊</span></div>
</div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { FXAAShader } from 'three/addons/shaders/FXAAShader.js';

const canvas = document.getElementById('canvas');
const overlay = document.getElementById('overlay');
const scoreEl = document.getElementById('score');
const hpEl = document.getElementById('hp');
const waveEl = document.getElementById('wave');

let scene, camera, renderer, composer, fxaaPass, starField;
let bullets = [], enemies = [], explosions = [], powerups = [];
let score, hp, wave, gameOver, playerName, seed;
let keys = {}, mouse = {x:0,y:0}, shipOffset = new THREE.Vector3();
let lastShot = 0;
let rng; // seeded rng
let shakeTime = 0, shakeMag = 0;
let combo = 0, comboTimer = 0, powerup = null, powerupTime = 0;

function mulberry32(a){return function(){let t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}

function initScene(){
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0a0420, 0.015);
  camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 500);
  camera.position.set(0,0,0);
  renderer = new THREE.WebGLRenderer({canvas, antialias:false, powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  renderer.setSize(innerWidth, innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  renderer.outputColorSpace = THREE.SRGBColorSpace;

  // Post-processing: Bloom + FXAA for that cinematic neon glow
  composer = new EffectComposer(renderer);
  composer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
  composer.setSize(innerWidth, innerHeight);
  composer.addPass(new RenderPass(scene, camera));
  composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.1, 0.7, 0.18));
  fxaaPass = new ShaderPass(FXAAShader);
  fxaaPass.material.uniforms['resolution'].value.set(1/innerWidth, 1/innerHeight);
  composer.addPass(fxaaPass);

  scene.add(new THREE.AmbientLight(0x303050, 0.5));
  const l = new THREE.PointLight(0x00e5ff, 1.5, 80); l.position.set(10,10,10); scene.add(l);
  const l2 = new THREE.PointLight(0xff2d95, 1.2, 80); l2.position.set(-10,-10,-10); scene.add(l2);

  // Starfield
  const sg = new THREE.BufferGeometry();
  const sp = new Float32Array(1500*3);
  const sc = new Float32Array(1500*3);
  for(let i=0;i<1500;i++){
    sp[i*3]=(Math.random()-0.5)*300;
    sp[i*3+1]=(Math.random()-0.5)*300;
    sp[i*3+2]=-Math.random()*400;
    const col = new THREE.Color().setHSL(Math.random(),0.8,0.7);
    sc[i*3]=col.r; sc[i*3+1]=col.g; sc[i*3+2]=col.b;
  }
  sg.setAttribute('position', new THREE.BufferAttribute(sp,3));
  sg.setAttribute('color', new THREE.BufferAttribute(sc,3));
  starField = new THREE.Points(sg, new THREE.PointsMaterial({size:0.8, vertexColors:true, transparent:true, opacity:0.85, sizeAttenuation:true}));
  scene.add(starField);

  addEventListener('resize', ()=>{
    camera.aspect=innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth,innerHeight);
    composer.setSize(innerWidth,innerHeight);
    fxaaPass.material.uniforms['resolution'].value.set(1/innerWidth,1/innerHeight);
  });
}

const RIM_VERT = `varying vec3 vN; varying vec3 vV;
void main(){vN=normalize(normalMatrix*normal);vec4 mv=modelViewMatrix*vec4(position,1.);vV=normalize(-mv.xyz);gl_Position=projectionMatrix*mv;}`;
const RIM_FRAG = `varying vec3 vN; varying vec3 vV; uniform vec3 color; uniform float power;
void main(){float f=pow(1.-max(dot(vN,vV),0.),power);gl_FragColor=vec4(color*f*1.6,f);}`;

// Enemy types: basic, chaser (follows player), splitter (splits into 2 on death), boss
function spawnEnemy(type){
  if (!type) {
    const r = rng();
    // Weights shift with wave: more chasers/splitters later
    if (wave >= 3 && r < 0.15 + wave*0.02) type = 'splitter';
    else if (wave >= 2 && r < 0.35) type = 'chaser';
    else type = 'basic';
  }
  let size = 1.1, detail = 1, baseSpeed = 0.4, hp = 1, scoreMult = 1, hue = rng()*360;
  if (type === 'chaser') { size = 0.9; hue = (hue+40)%360; baseSpeed = 0.55; }
  else if (type === 'splitter') { size = 1.3; hue = (hue+80)%360; baseSpeed = 0.3; hp = 2; scoreMult = 1.5; }
  else if (type === 'boss') { size = 2.6; detail = 2; baseSpeed = 0.22; hp = 12; scoreMult = 6; hue = 320; }

  const g = (type === 'splitter') ? new THREE.DodecahedronGeometry(size, 0)
    : (type === 'chaser') ? new THREE.TetrahedronGeometry(size, 0)
    : (type === 'boss') ? new THREE.IcosahedronGeometry(size, 1)
    : new THREE.OctahedronGeometry(size, detail);
  const baseCol = new THREE.Color(`hsl(${hue|0},100%,55%)`);
  const m = new THREE.MeshStandardMaterial({color: baseCol, emissive: baseCol.clone().multiplyScalar(0.7), emissiveIntensity: type === 'boss' ? 1.8 : 1.4, metalness:0.55, roughness:0.25});
  const mesh = new THREE.Mesh(g,m);
  const spawnRange = type === 'boss' ? 25 : 40;
  mesh.position.set((rng()-0.5)*spawnRange,(rng()-0.5)*(spawnRange*0.65),-200-rng()*60);
  const rimGeom = g.clone();
  rimGeom.scale(1.15, 1.15, 1.15);
  const rimMat = new THREE.ShaderMaterial({
    vertexShader: RIM_VERT, fragmentShader: RIM_FRAG,
    uniforms: {color: {value: baseCol.clone()}, power: {value: 2.2}},
    transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.BackSide
  });
  mesh.add(new THREE.Mesh(rimGeom, rimMat));
  mesh.userData = {type, speed: baseSpeed + rng()*0.2 + wave*0.04, rx: rng()*0.04, ry: rng()*0.04, hp, maxHp: hp, scoreMult, size};
  scene.add(mesh);
  enemies.push(mesh);
}

const POWERUP_TYPES = ['triple', 'shield', 'score2x'];
const POWERUP_COLORS = {triple: 0xfde047, shield: 0x22ffa7, score2x: 0xff2d95};

function spawnPowerup(pos){
  if (rng() > 0.18) return; // 18% drop rate
  const type = POWERUP_TYPES[(rng()*3)|0];
  const color = POWERUP_COLORS[type];
  const g = new THREE.IcosahedronGeometry(0.55, 0);
  const m = new THREE.MeshStandardMaterial({color, emissive: color, emissiveIntensity: 1.6, metalness:0.4, roughness:0.3, toneMapped: false});
  const mesh = new THREE.Mesh(g, m);
  mesh.position.copy(pos);
  mesh.userData = {type, color, life: 360};
  scene.add(mesh);
  powerups.push(mesh);
}

function makeBullet(dirOverride){
  const g = new THREE.CylinderGeometry(0.06,0.18,2.2,8);
  g.rotateX(Math.PI/2);
  const color = powerup === 'triple' ? 0xfde047 : 0x00e5ff;
  const m = new THREE.MeshBasicMaterial({color, toneMapped:false});
  const mesh = new THREE.Mesh(g,m);
  mesh.position.copy(camera.position);
  const dir = dirOverride ? dirOverride.clone() : (() => {
    const d = new THREE.Vector3();
    camera.getWorldDirection(d);
    d.x += mouse.x*0.3; d.y += mouse.y*0.3;
    return d.normalize();
  })();
  mesh.userData = {vel: dir.clone().multiplyScalar(3.0), life: 80};
  mesh.lookAt(mesh.position.clone().add(mesh.userData.vel));
  const trailMat = new THREE.SpriteMaterial({color, transparent:true, opacity:0.7, blending: THREE.AdditiveBlending});
  const trail = new THREE.Sprite(trailMat);
  trail.scale.set(0.9, 2.4, 1);
  mesh.add(trail);
  scene.add(mesh);
  bullets.push(mesh);
}

function spawnBullet(){
  if (powerup === 'triple') {
    const d = new THREE.Vector3();
    camera.getWorldDirection(d);
    d.x += mouse.x*0.3; d.y += mouse.y*0.3; d.normalize();
    makeBullet(d);
    // 2 side bullets with angle offset
    const left = d.clone(); left.applyAxisAngle(new THREE.Vector3(0,1,0), 0.08); makeBullet(left);
    const right = d.clone(); right.applyAxisAngle(new THREE.Vector3(0,1,0), -0.08); makeBullet(right);
  } else {
    makeBullet();
  }
}

function explode(pos, color){
  shakeTime = 14; shakeMag = 0.25;
  // Flash core
  const flashMat = new THREE.MeshBasicMaterial({color, transparent:true, opacity:1, toneMapped:false});
  const flash = new THREE.Mesh(new THREE.SphereGeometry(0.6, 12, 8), flashMat);
  flash.position.copy(pos);
  flash.userData = {vel: new THREE.Vector3(), life: 12, scale: 1.0, isFlash: true};
  scene.add(flash); explosions.push(flash);
  // Shards
  for(let i=0;i<22;i++){
    const g = new THREE.SphereGeometry(0.13,4,3);
    const m = new THREE.MeshBasicMaterial({color, transparent:true, opacity:1, toneMapped:false});
    const p = new THREE.Mesh(g,m);
    p.position.copy(pos);
    const v = new THREE.Vector3((Math.random()-0.5)*0.9,(Math.random()-0.5)*0.9,(Math.random()-0.5)*0.9);
    p.userData = {vel:v, life: 40 + (Math.random()*20|0)};
    scene.add(p);
    explosions.push(p);
  }
}

function updateHUD(){
  scoreEl.textContent=score;hpEl.textContent=Math.max(0,hp|0);waveEl.textContent=wave;
  const comboPill = document.getElementById('comboPill');
  const comboVal = document.getElementById('comboVal');
  if (combo > 1) { comboPill.style.display='inline-block'; comboVal.textContent = combo; }
  else { comboPill.style.display='none'; }
  const pwPill = document.getElementById('pwPill');
  const pwVal = document.getElementById('pwVal');
  if (powerup && powerupTime > 0) {
    pwPill.style.display='inline-block';
    const label = {triple:'三連射',shield:'護盾',score2x:'雙倍分數'}[powerup] || powerup;
    pwVal.textContent = `${label} · ${(powerupTime/60).toFixed(1)}s`;
    pwPill.style.borderColor = `rgba(${powerup==='triple'?'253,224,71':powerup==='shield'?'34,255,167':'255,45,149'},.55)`;
    pwPill.style.color = `#${powerup==='triple'?'fde047':powerup==='shield'?'22ffa7':'ff2d95'}`;
  } else { pwPill.style.display='none'; }
}

async function startGame(){
  const input = document.getElementById('player');
  playerName = (input.value||'').trim()||'anon';
  localStorage.setItem('arcade_player', playerName);

  // Fetch seed from backend
  try {
    const r = await fetch('/api/games/seed/shooter3d');
    const d = await r.json();
    seed = d.seed || Math.floor(Math.random()*1e9);
  } catch(e) { seed = Math.floor(Math.random()*1e9); }
  rng = mulberry32(seed);

  overlay.style.display = 'none';
  document.getElementById('hud').style.display = 'block';
  document.getElementById('crosshair').style.display = 'block';

  if (!scene) { initScene(); animate(); }
  bullets.forEach(b=>scene.remove(b)); bullets=[];
  enemies.forEach(e=>scene.remove(e)); enemies=[];
  explosions.forEach(e=>scene.remove(e)); explosions=[];
  powerups.forEach(p=>scene.remove(p)); powerups=[];
  score=0; hp=100; wave=1; gameOver=false;
  combo=0; comboTimer=0; powerup=null; powerupTime=0;
  for(let i=0;i<6;i++) spawnEnemy('basic');
  updateHUD();
}
window.startGame = startGame;

async function endGame(){
  gameOver = true;
  overlay.innerHTML = `
  <div class="panel">
    <h1 style="background:linear-gradient(135deg,#ff2d95,#fde047);-webkit-background-clip:text;background-clip:text;color:transparent">GAME OVER</h1>
    <p>分數 <b style="color:#00e5ff">${score}</b> · Wave ${wave}</p>
    <div id="rankMsg" style="color:#fde047;margin-bottom:8px;font-size:.85rem">上傳分數中…</div>
    <button class="btn" onclick="location.reload()">↺ 再來一局</button>
    <a class="btn btn-ghost" href="/games/" style="text-decoration:none;display:inline-block">← 遊戲中心</a>
  </div>`;
  overlay.style.display = 'flex';
  document.getElementById('crosshair').style.display = 'none';
  try {
    const res = await fetch('/api/games/scores',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({game:'shooter3d',player:playerName,score,level:wave,meta:{seed}})});
    const data = await res.json();
    const rm = document.getElementById('rankMsg');
    if (rm) rm.textContent = data.rank ? `全站排行第 #${data.rank}!` : '分數已上傳';
  } catch(e){
    const rm = document.getElementById('rankMsg');
    if (rm) rm.textContent = '分數上傳失敗（離線）';
  }
}

function animate(){
  requestAnimationFrame(animate);
  if (!scene) return;

  if (!gameOver) {
    // Player input
    if (keys['KeyA']) shipOffset.x -= 0.12;
    if (keys['KeyD']) shipOffset.x += 0.12;
    if (keys['KeyW']) shipOffset.y += 0.12;
    if (keys['KeyS']) shipOffset.y -= 0.12;
    shipOffset.x = Math.max(-8, Math.min(8, shipOffset.x * 0.96));
    shipOffset.y = Math.max(-5, Math.min(5, shipOffset.y * 0.96));
    let sx = 0, sy = 0;
    if (shakeTime > 0) {
      sx = (Math.random()-0.5) * shakeMag;
      sy = (Math.random()-0.5) * shakeMag;
      shakeTime--;
      shakeMag *= 0.92;
    }
    camera.position.x = shipOffset.x + mouse.x * 1.5 + sx;
    camera.position.y = shipOffset.y + mouse.y * 1.0 + sy;
    camera.lookAt(mouse.x * 4, mouse.y * 3, -50);

    // Starfield parallax
    starField.rotation.z += 0.0002;

    // Enemies
    enemies.forEach((e, i) => {
      e.position.z += e.userData.speed;
      if (e.userData.type === 'chaser') {
        // Track player position (camera.position.xy)
        const dx = camera.position.x - e.position.x;
        const dy = camera.position.y - e.position.y;
        e.position.x += Math.sign(dx) * Math.min(0.08, Math.abs(dx)*0.02);
        e.position.y += Math.sign(dy) * Math.min(0.08, Math.abs(dy)*0.02);
      }
      e.rotation.x += e.userData.rx;
      e.rotation.y += e.userData.ry;
      if (e.position.z > 5) {
        hp -= e.userData.type === 'boss' ? 35 : (e.userData.type === 'splitter' ? 18 : 12);
        scene.remove(e); enemies[i] = null;
        explode(e.position, 0xff2d95);
        combo = 0;
      }
    });
    enemies = enemies.filter(e => e);

    // Bullets
    bullets.forEach((b, i) => {
      b.position.add(b.userData.vel);
      b.userData.life--;
      if (b.userData.life <= 0) { scene.remove(b); bullets[i] = null; }
    });
    bullets = bullets.filter(b => b);

    // Collisions — bullet vs enemy
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        const hitRadius = 1.2 + (e.userData.size || 1) * 0.3;
        if (b.position.distanceTo(e.position) < hitRadius) {
          e.userData.hp--;
          scene.remove(b); bullets.splice(i,1);
          if (e.userData.hp <= 0) {
            combo++; comboTimer = 120;
            const multiplier = powerup === 'score2x' ? 2 : 1;
            const comboBonus = Math.min(5, 1 + combo * 0.1);
            score += Math.floor(25 * wave * e.userData.scoreMult * multiplier * comboBonus);
            explode(e.position, 0x00e5ff);
            spawnPowerup(e.position);
            // Splitter: spawn 2 mini basics
            if (e.userData.type === 'splitter') {
              for (let k = 0; k < 2; k++) {
                spawnEnemy('basic');
                const mini = enemies[enemies.length - 1];
                mini.position.copy(e.position);
                mini.position.x += (k === 0 ? -2 : 2);
                mini.userData.speed *= 1.4;
              }
            }
            scene.remove(e); enemies.splice(j,1);
          } else {
            // Hit flash
            e.scale.multiplyScalar(1.15);
            setTimeout(() => e.scale && e.scale.multiplyScalar(1/1.15), 60);
          }
          break;
        }
      }
    }

    // Powerup pickup
    powerups.forEach((p, i) => {
      p.rotation.x += 0.05; p.rotation.y += 0.07;
      p.position.z += 0.18; // drift toward player
      p.userData.life--;
      if (p.position.distanceTo(camera.position) < 2.0) {
        powerup = p.userData.type;
        powerupTime = 480; // ~8s at 60fps
        if (p.userData.type === 'shield') hp = Math.min(100, hp + 25);
        scene.remove(p); powerups[i] = null;
      } else if (p.userData.life <= 0 || p.position.z > 8) {
        scene.remove(p); powerups[i] = null;
      }
    });
    powerups = powerups.filter(p => p);

    // Combo decay
    if (comboTimer > 0) { comboTimer--; } else { combo = 0; }

    // Powerup decay
    if (powerupTime > 0) { powerupTime--; } else { powerup = null; }

    // Spawn more
    const target = 5 + wave;
    while (enemies.length < target) spawnEnemy();
    // Boss every 3 waves
    if (wave > 0 && wave % 3 === 0 && !enemies.some(e => e.userData.type === 'boss') && score >= wave * 300) {
      spawnEnemy('boss');
    }
    if (score >= wave * 500) { wave++; }

    // Shield reduces damage
    if (powerup === 'shield') hp = Math.min(100, hp + 0.05);

    if (hp <= 0 && !gameOver) endGame();
  }

  // Explosions
  explosions.forEach((p, i) => {
    p.position.add(p.userData.vel);
    if (p.userData.isFlash) {
      p.scale.multiplyScalar(1.25);
      p.material.opacity *= 0.82;
    } else {
      p.material.opacity = Math.max(0, p.userData.life / 50);
    }
    p.userData.life--;
    if (p.userData.life <= 0) { scene.remove(p); explosions[i] = null; }
  });
  explosions = explosions.filter(p => p);

  updateHUD();
  composer.render();
}

addEventListener('keydown', e => keys[e.code] = true);
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('mousemove', e => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
});
addEventListener('mousedown', e => {
  if (e.button !== 0 || gameOver || overlay.style.display !== 'none') return;
  const now = performance.now();
  if (now - lastShot < 120) return;
  lastShot = now;
  spawnBullet();
});

async function loadLB() {
  const el = document.getElementById('lbList');
  try {
    const res = await fetch('/api/games/leaderboard/shooter3d?limit=5');
    const data = await res.json();
    if (!data.entries || !data.entries.length) { el.innerHTML = '<div style="color:#8b92c0">尚無紀錄</div>'; return; }
    el.innerHTML = data.entries.map((e,i) => `<div class="lb-entry"><span>#${i+1} ${escapeHtml(e.player)}</span><span style="color:#00e5ff">${e.score}</span></div>`).join('');
  } catch(err) { el.innerHTML = '<div style="color:#8b92c0">排行榜暫無法取得</div>'; }
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

document.getElementById('player').value = localStorage.getItem('arcade_player') || '';
loadLB();
</script>
