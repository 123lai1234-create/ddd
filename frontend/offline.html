<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>離線 | 工程 × 生醫 × AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0a1116;
            color: #e6edf3;
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            padding: 24px;
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.5rem;
            margin-bottom: 12px;
        }

        p {
            color: #7d8590;
            max-width: 400px;
            line-height: 1.6;
        }

        .btn {
            margin-top: 24px;
            padding: 12px 32px;
            background: #58d7ff;
            color: #0a1116;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
        }

        .btn:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>
    <div class="icon">📡</div>
    <h1>目前離線</h1>
    <p>請檢查您的網路連線。連線恢復後頁面將自動重新載入。</p>
    <a href="/" class="btn">重新嘗試</a>
    <script>
        // Auto-reload when back online
        window.addEventListener('online', () => location.reload());
    </script>
</body>

</html>
