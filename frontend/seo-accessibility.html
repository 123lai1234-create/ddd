<!-- 5. 可訪問性改進 -->
<html lang="zh-TW" dir="ltr">
<head>
  <!-- 語言聲明 -->
  <link rel="alternate" hreflang="en" href="https://donttalk.vercel.app/en/games/xian/">
  <link rel="alternate" hreflang="zh-TW" href="https://donttalk.vercel.app/games/xian/">
  
  <!-- 預連接 CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  
  <!-- 預加載關鍵資源 -->
  <link rel="preload" as="script" href="/games/xian/main.js">
  <link rel="preload" as="style" href="/styles/game.css">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  
  <!-- 主題顏色 -->
  <meta name="theme-color" content="#08060e">
</head>

<body>
  <!-- 跳過導航連結 (可訪問性) -->
  <a href="#main-content" class="skip-link">跳過導航，前往主要內容</a>
  
  <!-- 主要內容區域 -->
  <main id="main-content" role="main">
    <!-- 遊戲容器 -->
    <div id="game-container" role="application" aria-label="仙俠傳遊戲">
      <!-- 遊戲內容 -->
    </div>
    
    <!-- 載入狀態指示器 -->
    <div id="loading-indicator" role="status" aria-live="polite" aria-label="遊戲載入中">
      <span>載入中...</span>
    </div>
    
    <!-- 無障礙文字說明 -->
    <div class="sr-only" role="complementary">
      <h2>遊戲說明</h2>
      <p>仙俠傳是一款回合制 RPG 遊戲。使用方向鍵或滑鼠移動角色，按 Enter 或點擊按鈕執行行動。</p>
    </div>
  </main>
  
  <!-- 頁尾 -->
  <footer role="contentinfo">
    <nav aria-label="頁尾導航">
      <a href="/">首頁</a>
      <a href="/about">關於我們</a>
      <a href="/privacy">隱私政策</a>
      <a href="/terms">使用條款</a>
    </nav>
  </footer>

  <style>
    /* 跳過導航連結 */
    .skip-link {
      position: absolute;
      top: -40px;
      left: 0;
      background: #000;
      color: #fff;
      padding: 8px;
      z-index: 100;
    }
    
    .skip-link:focus {
      top: 0;
    }
    
    /* 螢幕閱讀器專用文字 */
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border-width: 0;
    }
    
    /* 焦點指示器 */
    *:focus {
      outline: 2px solid #ffd700;
      outline-offset: 2px;
    }
    
    /* 按鈕可訪問性 */
    button {
      min-height: 44px; /* 觸控友善的最小尺寸 */
      min-width: 44px;
      font-size: 16px; /* 防止自動縮放 */
    }
    
    /* 顏色對比度 */
    body {
      color: #f0e6c8; /* WCAG AA 標準 */
      background-color: #08060e;
    }
  </style>
</body>
</html>
