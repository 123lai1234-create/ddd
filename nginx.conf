gzip on;
gzip_comp_level 5;
gzip_min_length 256;
gzip_proxied any;
gzip_vary on;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/x-javascript
    image/svg+xml
    font/woff2;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options  "nosniff"                             always;
    add_header X-Frame-Options         "SAMEORIGIN"                          always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin"     always;
    add_header X-XSS-Protection        "1; mode=block"                       always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Friendly URL redirects (mirrors render.yaml)
    location = /about     { return 301 /about_me.html; }
    location = /works     { return 301 /works.html; }
    location = /gene-ai   { return 301 /gene_ai.html; }
    location = /ngs       { return 301 /ngs.html; }
    location = /report    { return 301 /report.html; }
    location = /interview { return 301 /interview_prep.html; }

    # Static assets — cache aggressively
    location ~* \.(css|js|png|jpg|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else → try file, fall back to index.html (SPA fallback)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
