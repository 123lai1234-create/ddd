services:
  - type: web
    name: jtlai-engineering-biomed-portfolio
    runtime: static
    plan: free
    buildCommand: bash ./scripts/build_static_site.sh
    staticPublishPath: ./dist
    envVars:
      - key: API_BASE_URL
        value: https://jtlai-engineering-biomed-api.onrender.com
    buildFilter:
      paths:
        - "*.html"
        - "outputs/*.png"
        - "README.md"
        - "demo_notebook.ipynb"
        - "render.yaml"
        - "scripts/build_static_site.sh"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: redirect
        source: /about
        destination: /about_me.html
      - type: redirect
        source: /works
        destination: /works.html
      - type: redirect
        source: /gene-ai
        destination: /gene_ai.html
      - type: redirect
        source: /ngs
        destination: /ngs.html
      - type: redirect
        source: /report
        destination: /report.html
      - type: redirect
        source: /interview
        destination: /interview_prep.html
  - type: web
    name: jtlai-engineering-biomed-api
    runtime: python
    plan: free
    buildCommand: pip install -r site_api/requirements.txt
    startCommand: uvicorn site_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    buildFilter:
      paths:
        - "site_api/**"
        - "render.yaml"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jtlai-engineering-biomed-db
          property: connectionString

databases:
  - name: jtlai-engineering-biomed-db
    plan: free
