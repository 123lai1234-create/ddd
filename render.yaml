services:
  - type: web
    name: donttalk
    runtime: static
    buildCommand: bash ./scripts/build_static_site.sh
    staticPublishPath: ./dist
    buildFilter:
      paths:
        - "frontend/**"
        - "outputs/*.png"
        - "README.md"
        - "demo_notebook.ipynb"
        - "render.yaml"
        - "scripts/build_static_site.sh"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: redirect
        source: /about
        destination: /about_me.html
      - type: redirect
        source: /works
        destination: /works.html
      - type: redirect
        source: /gene-ai
        destination: /gene_ai.html
      - type: redirect
        source: /ngs
        destination: /ngs.html
      - type: redirect
        source: /report
        destination: /report.html
      - type: redirect
        source: /interview
        destination: /interview_prep.html
  - type: web
    name: donttalk-api
    runtime: python
    plan: free
    buildCommand: pip install -r site_api/requirements.txt
    startCommand: uvicorn site_api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    buildFilter:
      paths:
        - "site_api/**"
        - "render.yaml"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_NEON
        sync: false
      - key: DATABASE_URL_SUPABASE
        sync: false
      - key: DATABASE_URL_COCKROACH
        sync: false
      - key: DATABASE_URL_AIVEN
        sync: false
      - key: DATABASE_URL_RAILWAY
        sync: false
