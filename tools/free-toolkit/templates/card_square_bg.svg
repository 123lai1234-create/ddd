<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04070C" stop-opacity="0"/>
      <stop offset="14%" stop-color="#04070C" stop-opacity="0.74"/>
      <stop offset="86%" stop-color="#04070C" stop-opacity="0.74"/>
      <stop offset="100%" stop-color="#04070C" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.7">
      <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <image href="{{BG_IMAGE}}" xlink:href="{{BG_IMAGE}}" x="0" y="0" width="1080" height="1080" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1080" height="1080" fill="#04070C" opacity="0.3"/>
  <rect x="0" y="240" width="1080" height="800" fill="url(#band)"/>
  <rect width="1080" height="1080" fill="url(#vig)"/>

  <g opacity="0.22" fill="none" stroke="{{COLOR1}}" stroke-width="2">
    <circle cx="905" cy="175" r="255"/>
    <circle cx="905" cy="175" r="320"/>
  </g>

  <g opacity="0.92" fill="none" stroke="{{COLOR1}}" stroke-width="6">
    <circle cx="116" cy="228" r="26"/>
    <circle cx="185" cy="228" r="26"/>
  </g>

  {{LYRIC_LINES}}

  <rect x="96" y="586" width="92" height="10" rx="5" fill="{{COLOR1}}"/>

  <text x="96" y="700" font-family="{{FONT}}" font-size="104" font-weight="bold"
        fill="{{TEXTCOLOR}}" letter-spacing="2">{{TITLE}}</text>

  <text x="96" y="782" font-family="{{FONT}}" font-size="42" fill="{{COLOR1}}"
        letter-spacing="6">{{ARTIST}}</text>

  <g opacity="0.55">
    <text x="96" y="980" font-family="{{FONT}}" font-size="26" fill="{{TEXTCOLOR}}" opacity="0.7">{{SUBTITLE}}</text>
  </g>
  <line x1="96" y1="1006" x2="984" y2="1006" stroke="{{COLOR1}}" stroke-width="1" opacity="0.3"/>
</svg>
