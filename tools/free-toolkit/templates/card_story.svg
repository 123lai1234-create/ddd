<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="{{COLOR2}}"/>
      <stop offset="100%" stop-color="{{COLOR3}}"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.28" r="0.62">
      <stop offset="0%" stop-color="{{COLOR1}}" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="{{COLOR1}}" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>
  <rect width="1080" height="1920" fill="url(#glow)"/>

  <g opacity="0.14" fill="none" stroke="{{COLOR1}}" stroke-width="2">
    <circle cx="540" cy="700" r="300"/>
    <circle cx="540" cy="700" r="380"/>
    <circle cx="540" cy="700" r="460"/>
  </g>

  <g opacity="0.9" fill="none" stroke="{{COLOR1}}" stroke-width="7">
    <circle cx="130" cy="426" r="28"/>
    <circle cx="203" cy="426" r="28"/>
  </g>

  {{LYRIC_LINES}}

  <rect x="110" y="1290" width="104" height="12" rx="6" fill="{{COLOR1}}"/>

  <text x="110" y="1430" font-family="{{FONT}}" font-size="118" font-weight="bold"
        fill="{{TEXTCOLOR}}" letter-spacing="2">{{TITLE}}</text>

  <text x="110" y="1524" font-family="{{FONT}}" font-size="46" fill="{{COLOR1}}"
        letter-spacing="8">{{ARTIST}}</text>

  <g opacity="0.5">
    <text x="110" y="1790" font-family="{{FONT}}" font-size="30" fill="{{TEXTCOLOR}}" opacity="0.6">{{SUBTITLE}}</text>
  </g>
  <line x1="110" y1="1822" x2="970" y2="1822" stroke="{{COLOR1}}" stroke-width="1" opacity="0.22"/>
</svg>
