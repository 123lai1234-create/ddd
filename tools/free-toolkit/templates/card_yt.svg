<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0.8">
      <stop offset="0%" stop-color="{{COLOR2}}"/>
      <stop offset="100%" stop-color="{{COLOR3}}"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.9" cy="0.85" r="0.7">
      <stop offset="0%" stop-color="{{COLOR1}}" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="{{COLOR1}}" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <g opacity="0.15" fill="none" stroke="{{COLOR1}}" stroke-width="2">
    <circle cx="1120" cy="600" r="210"/>
    <circle cx="1120" cy="600" r="280"/>
  </g>

  <g opacity="0.9" fill="none" stroke="{{COLOR1}}" stroke-width="5">
    <circle cx="96" cy="116" r="21"/>
    <circle cx="156" cy="116" r="21"/>
  </g>

  {{LYRIC_LINES}}

  <rect x="76" y="452" width="88" height="10" rx="5" fill="{{COLOR1}}"/>

  <text x="76" y="566" font-family="{{FONT}}" font-size="92" font-weight="bold"
        fill="{{TEXTCOLOR}}" letter-spacing="1">{{TITLE}}</text>

  <text x="76" y="630" font-family="{{FONT}}" font-size="34" fill="{{COLOR1}}"
        letter-spacing="5">{{ARTIST}}</text>

  <g opacity="0.5">
    <text x="1204" y="630" text-anchor="end" font-family="{{FONT}}" font-size="24"
          fill="{{TEXTCOLOR}}" opacity="0.6">{{SUBTITLE}}</text>
  </g>
</svg>
