<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04070C" stop-opacity="0"/>
      <stop offset="14%" stop-color="#04070C" stop-opacity="0.74"/>
      <stop offset="86%" stop-color="#04070C" stop-opacity="0.74"/>
      <stop offset="100%" stop-color="#04070C" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.7">
      <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <image href="{{BG_IMAGE}}" xlink:href="{{BG_IMAGE}}" x="0" y="0" width="1280" height="720" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1280" height="720" fill="#04070C" opacity="0.3"/>
  <rect x="0" y="140" width="1280" height="540" fill="url(#band)"/>
  <rect width="1280" height="720" fill="url(#vig)"/>

  <g opacity="0.22" fill="none" stroke="{{COLOR1}}" stroke-width="2">
    <circle cx="1120" cy="600" r="210"/>
    <circle cx="1120" cy="600" r="280"/>
  </g>

  <g opacity="0.92" fill="none" stroke="{{COLOR1}}" stroke-width="5">
    <circle cx="96" cy="116" r="21"/>
    <circle cx="156" cy="116" r="21"/>
  </g>

  {{LYRIC_LINES}}

  <rect x="76" y="452" width="88" height="10" rx="5" fill="{{COLOR1}}"/>

  <text x="76" y="566" font-family="{{FONT}}" font-size="92" font-weight="bold"
        fill="{{TEXTCOLOR}}" letter-spacing="1">{{TITLE}}</text>

  <text x="76" y="630" font-family="{{FONT}}" font-size="34" fill="{{COLOR1}}"
        letter-spacing="5">{{ARTIST}}</text>

  <g opacity="0.55">
    <text x="1204" y="630" text-anchor="end" font-family="{{FONT}}" font-size="24"
          fill="{{TEXTCOLOR}}" opacity="0.7">{{SUBTITLE}}</text>
  </g>
</svg>
