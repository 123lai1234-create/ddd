<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="{{COLOR2}}"/>
      <stop offset="100%" stop-color="{{COLOR3}}"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.88" cy="0.2" r="0.66">
      <stop offset="0%" stop-color="{{COLOR1}}" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="{{COLOR1}}" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g opacity="0.15" fill="none" stroke="{{COLOR1}}" stroke-width="2">
    <circle cx="1050" cy="120" r="150"/>
    <circle cx="1050" cy="120" r="205"/>
  </g>

  <rect x="80" y="150" width="76" height="9" rx="4.5" fill="{{COLOR1}}"/>

  <text x="80" y="268" font-family="{{FONT}}" font-size="78" font-weight="bold"
        fill="{{TEXTCOLOR}}" letter-spacing="1">{{TITLE}}</text>

  <text x="80" y="336" font-family="{{FONT}}" font-size="34" fill="{{COLOR1}}"
        letter-spacing="6">{{ARTIST}}</text>

  {{LYRIC_LINES}}

  <g opacity="0.55">
    <text x="80" y="556" font-family="{{FONT}}" font-size="23" fill="{{TEXTCOLOR}}" opacity="0.7">{{SUBTITLE}}</text>
  </g>
  <line x1="80" y1="578" x2="1120" y2="578" stroke="{{COLOR1}}" stroke-width="1" opacity="0.22"/>
</svg>
