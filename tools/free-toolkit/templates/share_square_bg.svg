<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04070C" stop-opacity="0"/>
      <stop offset="14%" stop-color="#04070C" stop-opacity="0.74"/>
      <stop offset="86%" stop-color="#04070C" stop-opacity="0.74"/>
      <stop offset="100%" stop-color="#04070C" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.7">
      <stop offset="50%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <image href="{{BG_IMAGE}}" xlink:href="{{BG_IMAGE}}" x="0" y="0" width="1200" height="1200" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1200" height="1200" fill="#04070C" opacity="0.3"/>
  <rect x="0" y="240" width="1200" height="900" fill="url(#band)"/>
  <rect width="1200" height="1200" fill="url(#vig)"/>

  <g opacity="0.2" fill="none" stroke="{{COLOR1}}" stroke-width="2">
    <circle cx="120" cy="1080" r="230"/>
    <circle cx="120" cy="1080" r="300"/>
  </g>

  <g opacity="0.92" fill="none" stroke="{{COLOR1}}" stroke-width="7">
    <circle cx="130" cy="236" r="28"/>
    <circle cx="203" cy="236" r="28"/>
  </g>

  {{LYRIC_LINES}}

  <rect x="110" y="760" width="96" height="11" rx="5.5" fill="{{COLOR1}}"/>

  <text x="110" y="880" font-family="{{FONT}}" font-size="108" font-weight="bold"
        fill="{{TEXTCOLOR}}" letter-spacing="2">{{TITLE}}</text>

  <text x="110" y="962" font-family="{{FONT}}" font-size="42" fill="{{COLOR1}}"
        letter-spacing="7">{{ARTIST}}</text>

  <g opacity="0.55">
    <text x="110" y="1090" font-family="{{FONT}}" font-size="26" fill="{{TEXTCOLOR}}" opacity="0.7">{{SUBTITLE}}</text>
  </g>
  <line x1="110" y1="1116" x2="1090" y2="1116" stroke="{{COLOR1}}" stroke-width="1" opacity="0.3"/>
</svg>
